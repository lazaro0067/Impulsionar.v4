<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impulsionar V4</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --azul-corp: #0b1329;
    --azul-corp-2: #16213f;
    --cinza-100: #f4f6f9;
    --cinza-200: #e2e8f0;
    --cinza-500: #64748b;
    --cinza-700: #334155;
    --verde: #16a34a;
    --azul-acento: #2563eb;
    --vermelho: #dc2626;
    --amarelo: #d97706;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--cinza-100);
    color: var(--cinza-700);
  }
  /* ---------- LOGIN ---------- */
  #tela-login {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--azul-corp), var(--azul-corp-2));
  }
  .card-login {
    background: #fff;
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  .card-login h1 {
    text-align: center;
    color: var(--azul-corp);
    font-size: 26px;
    margin-bottom: 28px;
  }
  .logo-login { display: block; max-width: 180px; max-height: 100px; object-fit: contain; margin: 0 auto 24px; }
  .logo-sidebar {
    display: block; max-width: 140px; max-height: 70px; object-fit: contain; margin: 0 auto 16px;
    background: #fff; border-radius: 12px; padding: 8px 10px;
  }
  .logo-fallback-login { text-align: center; font-weight: 800; font-size: 22px; color: var(--azul-corp); margin-bottom: 24px; letter-spacing: .5px; }
  .logo-fallback-sidebar { text-align: center; font-weight: 800; font-size: 15px; color: #fff; background: rgba(255,255,255,.08); border-radius: 12px; padding: 12px 8px; margin: 0 auto 16px; letter-spacing: .5px; }
  .link-esqueci { text-align: center; margin-top: 14px; }
  .link-esqueci a { color: var(--azul-acento); font-size: 13px; text-decoration: none; }
  .link-esqueci a:hover { text-decoration: underline; }
  label { font-size: 13px; font-weight: 600; color: var(--cinza-700); display: block; margin-bottom: 6px; }
  input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--cinza-200);
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 16px;
    font-family: inherit;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    padding: 11px 18px;
    transition: opacity .15s;
  }
  button:hover { opacity: .88; }
  .btn-primario { background: var(--azul-corp); color: #fff; width: 100%; }
  .btn-secundario { background: var(--cinza-200); color: var(--cinza-700); }
  .btn-perigo { background: #fee2e2; color: var(--vermelho); }
  .btn-sm { padding: 6px 10px; font-size: 12px; }
  #erro-login { color: var(--vermelho); text-align: center; font-size: 13px; margin-top: 8px; min-height: 18px; }

  /* ---------- APP SHELL ---------- */
  #app { display: none; min-height: 100vh; }
  #app.ativo { display: flex; }
  .sidebar {
    width: 230px;
    background: var(--azul-corp);
    color: #cbd5e1;
    flex-shrink: 0;
    padding: 20px 0;
    display: flex;
    flex-direction: column;
  }
  .sidebar h2 { color: #fff; text-align: center; font-size: 18px; margin: 0 0 24px; }
  .sidebar .usuario { text-align: center; font-size: 12px; color: #94a3b8; margin-bottom: 20px; padding: 0 12px; }
  .sidebar nav { flex: 1; }
  .sidebar button.nav-item {
    display: block; width: 100%; text-align: left; background: none; border-radius: 0;
    color: #cbd5e1; padding: 12px 24px; font-size: 14px; font-weight: 500;
  }
  .sidebar button.nav-item:hover, .sidebar button.nav-item.ativo {
    background: rgba(255,255,255,.08); color: #fff; opacity: 1;
  }
  .sidebar .sair { margin: 12px 24px 0; }
  .conteudo { flex: 1; padding: 28px 36px; overflow-y: auto; max-height: 100vh; }
  .conteudo h1 { color: var(--azul-corp); margin-top: 0; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .kpi-card { background: #fff; border-radius: 12px; padding: 18px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .kpi-card .valor { font-size: 30px; font-weight: 700; color: var(--azul-corp); }
  .kpi-card .rotulo { font-size: 13px; color: var(--cinza-500); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
  .painel { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .painel h3 { margin-top: 0; font-size: 15px; color: var(--cinza-700); }

  .alerta-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--cinza-200); font-size: 13px; }
  .alerta-item:last-child { border-bottom: none; }
  .tag { padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .tag-vencido { background: #fee2e2; color: var(--vermelho); }
  .tag-breve { background: #fef3c7; color: var(--amarelo); }

  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  thead { background: var(--cinza-100); }
  th, td { text-align: left; padding: 12px 14px; font-size: 13px; border-bottom: 1px solid var(--cinza-200); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafbfc; }

  .barra-acoes { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
  .barra-acoes .direita { display: flex; gap: 8px; }

  .formulario { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .formulario .linha { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .formulario .acoes-form { display: flex; gap: 10px; margin-top: 4px; }
  .barra-progresso { background: var(--cinza-200); border-radius: 20px; height: 8px; width: 100px; overflow: hidden; }
  .barra-progresso > div { background: var(--verde); height: 100%; }
  .oculto { display: none !important; }
  .msg-vazio { color: var(--cinza-500); font-size: 13px; padding: 24px; text-align: center; }
  .toast {
    position: fixed; bottom: 24px; right: 24px; background: var(--azul-corp); color: #fff;
    padding: 12px 20px; border-radius: 8px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.25);
    opacity: 0; transform: translateY(10px); transition: all .25s; z-index: 999;
  }
  .toast.mostrar { opacity: 1; transform: translateY(0); }
  .toast.erro { background: var(--vermelho); }

  /* ---------- KPIs "estilo Power BI" ---------- */
  .kpi-card.vivo {
    position: relative; overflow: hidden; color: #fff; border: none;
  }
  .kpi-card.vivo .icone { position: absolute; right: 14px; top: 14px; font-size: 26px; opacity: .5; }
  .kpi-card.vivo .valor { color: #fff; }
  .kpi-card.vivo .rotulo { color: rgba(255,255,255,.85); }
  .kpi-card.vivo .subrotulo { font-size: 11px; color: rgba(255,255,255,.7); margin-top: 4px; }
  .kpi-azul   { background: linear-gradient(135deg, #0b1329, #1d3a8a); }
  .kpi-verde  { background: linear-gradient(135deg, #14532d, #16a34a); }
  .kpi-roxo   { background: linear-gradient(135deg, #3730a3, #6d28d9); }
  .kpi-laranja{ background: linear-gradient(135deg, #92400e, #d97706); }
  .kpi-ciano  { background: linear-gradient(135deg, #0e7490, #06b6d4); }
  .kpi-rosa   { background: linear-gradient(135deg, #9d174d, #db2777); }

  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px; }
  @media (max-width: 1100px) { .grid-3 { grid-template-columns: 1fr; } }

  .ranking-linha { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--cinza-200); }
  .ranking-linha:last-child { border-bottom: none; }
  .ranking-posicao {
    width: 26px; height: 26px; border-radius: 50%; background: var(--azul-corp); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0;
  }
  .ranking-info { flex: 1; min-width: 0; }
  .ranking-info .nome { font-size: 13px; font-weight: 600; color: var(--cinza-700); }
  .ranking-info .empresa { font-size: 11px; color: var(--cinza-500); }
  .ranking-nota { font-size: 13px; font-weight: 700; color: var(--azul-acento); white-space: nowrap; }

  /* ---------- Calendário ---------- */
  .calendario-cabecalho { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .calendario-cabecalho h3 { margin: 0; font-size: 16px; color: var(--azul-corp); text-transform: capitalize; }
  .calendario-grade { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .calendario-dow { text-align: center; font-size: 11px; font-weight: 700; color: var(--cinza-500); padding-bottom: 4px; }
  .calendario-dia {
    min-height: 84px; border-radius: 8px; background: var(--cinza-100); padding: 6px;
    font-size: 11px; border: 1px solid transparent;
  }
  .calendario-dia.fora-do-mes { opacity: .35; }
  .calendario-dia.hoje { border-color: var(--azul-acento); background: #eff6ff; }
  .calendario-dia .num-dia { font-weight: 700; color: var(--cinza-700); margin-bottom: 4px; }
  .evento-pill {
    display: block; border-radius: 5px; padding: 2px 5px; margin-bottom: 3px; font-size: 10px;
    color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default;
  }
  .evento-mentoria { background: var(--azul-acento); }
  .evento-pdi { background: var(--amarelo); }
  .evento-marco { background: var(--verde); }
  .legenda-calendario { display: flex; gap: 16px; margin-top: 14px; font-size: 12px; color: var(--cinza-500); }
  .legenda-item { display: flex; align-items: center; gap: 6px; }
  .legenda-bolinha { width: 10px; height: 10px; border-radius: 50%; }

  /* ---------- Planos de Consultoria ---------- */
  .plano-card { background: #fff; border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .plano-cabecalho { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .plano-cabecalho h4 { margin: 0 0 4px; color: var(--azul-corp); font-size: 15px; }
  .plano-meta { font-size: 12px; color: var(--cinza-500); }
  .plano-progresso-linha { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
  .plano-progresso-linha .barra-progresso { width: 100%; height: 10px; }
  .marco-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; border-bottom: 1px dashed var(--cinza-200); }
  .marco-item:last-child { border-bottom: none; }
  .marco-item.concluido { color: var(--cinza-500); text-decoration: line-through; }
  .marco-checkbox { width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; }
  .marco-data { margin-left: auto; font-size: 11px; color: var(--cinza-500); white-space: nowrap; }

  /* ---------- Academy Digital / Painel Social ---------- */
  .feed-videos { display: flex; flex-direction: column; gap: 18px; max-width: 720px; }
  .card-video { background: #fff; border-radius: 14px; padding: 20px 22px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card-video-cabecalho { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card-video-cabecalho h3 { margin: 0 0 4px; color: var(--azul-corp); font-size: 17px; }
  .card-video-meta { font-size: 12px; color: var(--cinza-500); }
  .card-video-acoes-admin { display: flex; gap: 6px; flex-shrink: 0; }
  .card-video-descricao { font-size: 13.5px; color: var(--cinza-700); margin: 10px 0; }
  .card-video-player { margin: 12px 0; }
  .link-video-externo { display: block; text-decoration: none; color: var(--azul-corp); background: var(--cinza-100, #f1f5f9); border-radius: 10px; overflow: hidden; text-align: center; }
  .link-video-externo div { padding: 14px; font-weight: 600; }
  .card-video-interacao { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border-top: 1px solid var(--cinza-200); padding-top: 12px; margin-top: 4px; }
  .card-video-interacao button, .card-video-interacao a { background: none; border: none; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--cinza-700); display: inline-flex; align-items: center; gap: 6px; text-decoration: none; padding: 6px 10px; border-radius: 8px; }
  .card-video-interacao button:hover, .card-video-interacao a:hover { background: var(--cinza-100, #f1f5f9); }
  .btn-curtir.curtido { color: #dc2626; }
  .area-comentarios { margin-top: 14px; border-top: 1px dashed var(--cinza-200); padding-top: 12px; }
  .lista-comentarios { display: flex; flex-direction: column; gap: 10px; max-height: 260px; overflow-y: auto; margin-bottom: 10px; }
  .comentario-item { background: var(--cinza-100, #f8fafc); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
  .comentario-cabecalho { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; font-size: 12px; }
  .comentario-data { color: var(--cinza-500); font-size: 11px; }
  .link-excluir-comentario { background: none; border: none; color: var(--vermelho, #dc2626); cursor: pointer; font-size: 11px; margin-left: auto; padding: 0; }
  .novo-comentario { display: flex; gap: 8px; }
  .novo-comentario input { flex: 1; padding: 9px 12px; border: 1px solid var(--cinza-200); border-radius: 8px; font-size: 13px; font-family: inherit; }
  .msg-vazio-sm { color: var(--cinza-500); font-size: 12px; padding: 10px 0; }
</style>
</head>
<body>

<!-- ===================== TELA DE LOGIN ===================== -->
<div id="tela-login">
  <div class="card-login">
    <img src="/assets/logo-impulsionar.jpg" alt="Impulsionar V4" class="logo-login" onerror="this.outerHTML='&lt;div class=&quot;logo-fallback-login&quot;&gt;IMPULSIONAR V4&lt;/div&gt;'">
    <form id="form-login">
      <label>E-mail de Acesso</label>
      <input type="email" id="login-email" required autocomplete="username">
      <label>Palavra-passe / Senha</label>
      <input type="password" id="login-senha" required autocomplete="current-password">
      <button type="submit" class="btn-primario">Entrar na Plataforma</button>
      <div id="erro-login"></div>
      <div class="link-esqueci"><a href="#" onclick="mostrarEsqueciSenha(); return false;">Esqueci minha senha</a></div>
    </form>
    <form id="form-esqueci-senha" class="oculto">
      <p style="font-size:13px; color:var(--cinza-500); margin:-8px 0 16px;">Informe o e-mail cadastrado. Vamos enviar um link para redefinir sua senha.</p>
      <label>E-mail cadastrado</label>
      <input type="email" id="esq-email" required>
      <button type="submit" class="btn-primario">Enviar link de redefinição</button>
      <div id="msg-esqueci" style="text-align:center; font-size:13px; margin-top:8px; min-height:18px;"></div>
      <div class="link-esqueci"><a href="#" onclick="esconderEsqueciSenha(); return false;">Voltar ao login</a></div>
    </form>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
  <aside class="sidebar">
    <img src="/assets/logo-impulsionar.jpg" alt="Impulsionar V4" class="logo-sidebar" id="logo-sidebar-img" onerror="this.outerHTML='&lt;div class=&quot;logo-fallback-sidebar&quot;&gt;IMPULSIONAR V4&lt;/div&gt;'">
    <div class="usuario" id="info-usuario"></div>
    <nav id="nav-menu"></nav>
    <button class="sair btn-secundario" onclick="sair()">Sair</button>
  </aside>
  <main class="conteudo" id="conteudo"></main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==========================================================
   ESTADO E HELPERS DE API
   ========================================================== */
let ESTADO = {
  token: localStorage.getItem('impulsionar_token') || null,
  usuario: JSON.parse(localStorage.getItem('impulsionar_usuario') || 'null'),
  abaAtual: 'dashboard',
  graficos: {}
};

function mostrarToast(msg, ehErro) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast mostrar' + (ehErro ? ' erro' : '');
  setTimeout(() => t.classList.remove('mostrar'), 3200);
}

async function api(caminho, opcoes = {}) {
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opcoes.headers || {});
  if (ESTADO.token) headers['Authorization'] = 'Bearer ' + ESTADO.token;
  const resp = await fetch(caminho, Object.assign({}, opcoes, { headers }));
  if (resp.status === 401 || resp.status === 403) {
    const dados = await resp.json().catch(() => ({}));
    if (resp.status === 401 && !opcoes._semLogout) {
      sair(true);
      throw new Error(dados.error || 'Sessão expirada.');
    }
    throw new Error(dados.error || 'Acesso negado.');
  }
  const dados = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(dados.error || 'Erro na requisição.');
  return dados;
}

/* ==========================================================
   LOGIN / LOGOUT
   ========================================================== */
document.getElementById('form-login').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;
  const erroEl = document.getElementById('erro-login');
  erroEl.textContent = '';
  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: senha })
    });
    const dados = await resp.json();
    if (!resp.ok) { erroEl.textContent = dados.error || 'Erro de ligação ao servidor.'; return; }
    ESTADO.token = dados.token;
    ESTADO.usuario = dados.user;
    localStorage.setItem('impulsionar_token', dados.token);
    localStorage.setItem('impulsionar_usuario', JSON.stringify(dados.user));
    iniciarApp();
  } catch (e) {
    erroEl.textContent = 'Erro de ligação ao servidor.';
  }
});

function mostrarEsqueciSenha() {
  document.getElementById('form-login').classList.add('oculto');
  document.getElementById('form-esqueci-senha').classList.remove('oculto');
}
function esconderEsqueciSenha() {
  document.getElementById('form-esqueci-senha').classList.add('oculto');
  document.getElementById('form-login').classList.remove('oculto');
  document.getElementById('msg-esqueci').textContent = '';
}
document.getElementById('form-esqueci-senha').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const email = document.getElementById('esq-email').value.trim();
  const msgEl = document.getElementById('msg-esqueci');
  msgEl.style.color = '';
  msgEl.textContent = 'Enviando...';
  try {
    const resp = await fetch('/api/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const dados = await resp.json();
    msgEl.textContent = dados.message || dados.error || 'Se este e-mail existir, você receberá as instruções.';
  } catch (e) {
    msgEl.style.color = 'var(--vermelho)';
    msgEl.textContent = 'Erro de ligação ao servidor.';
  }
});

function sair(silencioso) {
  ESTADO.token = null;
  ESTADO.usuario = null;
  localStorage.removeItem('impulsionar_token');
  localStorage.removeItem('impulsionar_usuario');
  document.getElementById('app').classList.remove('ativo');
  document.getElementById('tela-login').style.display = 'flex';
  document.getElementById('form-login').reset();
  if (!silencioso) mostrarToast('Sessão encerrada.');
}

/* ==========================================================
   MENU LATERAL (varia por perfil)
   ========================================================== */
const MENU_POR_PERFIL = {
  admin: [
    ['dashboard', 'Dashboard'], ['consulting', 'Consultoria'], ['companies', 'Empresas'], ['employees', 'Banco de Talentos'],
    ['pdi', 'PDIs'], ['videos', 'Academy Digital'], ['mentors', 'Mentores'],
    ['mentorships', 'Mentorias'], ['assessments', 'Competence Check']
  ],
  client_admin: [
    ['dashboard', 'Dashboard'], ['consulting', 'Consultoria'], ['employees', 'Banco de Talentos'], ['pdi', 'PDIs'],
    ['videos', 'Academy Digital'], ['mentorships', 'Mentorias'], ['assessments', 'Competence Check'], ['minhaEmpresa', 'Minha Empresa']
  ],
  autonomous: [
    ['dashboard', 'Meu Painel'], ['consulting', 'Meu Acompanhamento'], ['pdi', 'Meus PDIs'], ['videos', 'Academy Digital'],
    ['mentorships', 'Minhas Mentorias'], ['assessments', 'Meus Assessments']
  ],
  mentor: [
    ['videos', 'Academy Digital'], ['mentors', 'Meu Perfil de Mentor'], ['mentorships', 'Minhas Mentorias']
  ]
};

function iniciarApp() {
  document.getElementById('tela-login').style.display = 'none';
  document.getElementById('app').classList.add('ativo');
  const u = ESTADO.usuario;
  document.getElementById('info-usuario').innerHTML =
    `<strong>${escapeHtml(u.name)}</strong><br>${escapeHtml(u.companyName || '')}`;

  atualizarLogoSidebar();

  const nav = document.getElementById('nav-menu');
  nav.innerHTML = '';
  const itens = MENU_POR_PERFIL[u.role] || MENU_POR_PERFIL.autonomous;
  itens.forEach(([chave, rotulo]) => {
    const btn = document.createElement('button');
    btn.className = 'nav-item';

function irPara(aba) {

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function destruirGrafico(id) { if (ESTADO.graficos[id]) { ESTADO.graficos[id].destroy(); delete ESTADO.graficos[id]; } }

function desenharGraficoPizza(id, labels, valores) {
  destruirGrafico(id);
  const cores = ['#2563eb', '#16a34a', '#d97706', '#dc2626', '#64748b'];
  ESTADO.graficos[id] = new Chart(document.getElementById(id), {
    type: 'doughnut',
    data: { labels, datasets: [{ data: valores, backgroundColor: cores }] },
    options: { plugins: { legend: { position: 'bottom' } } }
  });
}

function desenharGraficoBarras(id, labels, valores) {
  destruirGrafico(id);
  ESTADO.graficos[id] = new Chart(document.getElementById(id), {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Executivos', data: valores, backgroundColor: '#0b1329' }] },
    options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
  });
}

function desenharGraficoRadar(id, labels, valores) {
  destruirGrafico(id);
  if (labels.length === 0) { labels = ['Sem dados']; valores = [0]; }
  ESTADO.graficos[id] = new Chart(document.getElementById(id), {
    type: 'radar',
    data: { labels, datasets: [{ label: 'Nota Média', data: valores, backgroundColor: 'rgba(37,99,235,.2)', borderColor: '#2563eb', pointBackgroundColor: '#2563eb' }] },
    options: { scales: { r: { min: 0, max: 100, ticks: { stepSize: 20 } } }, plugins: { legend: { display: false } } }
  });
}

function desenharGraficoTendencia(id, dados) {
  destruirGrafico(id);
  const labels = dados.map(d => {
    const [ano, mes] = d.mes.split('-');
    return ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][Number(mes) - 1] + '/' + ano.slice(2);
  });
  ESTADO.graficos[id] = new Chart(document.getElementById(id), {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: 'Nota Média', data: dados.map(d => d.mediaScore), borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,.1)', fill: true, tension: .35, yAxisID: 'y' },
        { label: 'Qtd. Assessments', data: dados.map(d => d.total), borderColor: '#16a34a', backgroundColor: 'rgba(22,163,74,.1)', fill: true, tension: .35, yAxisID: 'y1' }
      ]
    },
    options: {
      scales: {
        y: { position: 'left', min: 0, max: 100, title: { display: true, text: 'Nota' } },
        y1: { position: 'right', min: 0, ticks: { precision: 0 }, grid: { drawOnChartArea: false }, title: { display: true, text: 'Qtd.' } }
      }
    }
  });
}

function mudarMesCalendario(delta) {
  MES_CALENDARIO.setMonth(MES_CALENDARIO.getMonth() + delta);
  renderGradeCalendario();
}

function renderGradeCalendario() {
  const titulo = document.getElementById('titulo-calendario');
  const grade = document.getElementById('grade-calendario');
  if (!titulo || !grade) return;

  const nomesMes = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  titulo.textContent = nomesMes[MES_CALENDARIO.getMonth()] + ' de ' + MES_CALENDARIO.getFullYear();

  const ano = MES_CALENDARIO.getFullYear(), mes = MES_CALENDARIO.getMonth();
  const primeiroDiaSemana = new Date(ano, mes, 1).getDay();
  const diasNoMes = new Date(ano, mes + 1, 0).getDate();
  const hoje = new Date();

  const eventosPorDia = {};
  EVENTOS_CALENDARIO.forEach(ev => {
    const d = new Date(ev.data);
    if (isNaN(d.getTime())) return;
    if (d.getFullYear() === ano && d.getMonth() === mes) {
      const dia = d.getDate();
      (eventosPorDia[dia] = eventosPorDia[dia] || []).push(ev);
    }
  });

  let html = ['D','S','T','Q','Q','S','S'].map(d => `<div class="calendario-dow">${d}</div>`).join('');
  for (let i = 0; i < primeiroDiaSemana; i++) html += `<div class="calendario-dia fora-do-mes"></div>`;
  for (let dia = 1; dia <= diasNoMes; dia++) {
    const ehHoje = hoje.getFullYear() === ano && hoje.getMonth() === mes && hoje.getDate() === dia;
    const evs = eventosPorDia[dia] || [];
    html += `<div class="calendario-dia ${ehHoje ? 'hoje' : ''}">
      <div class="num-dia">${dia}</div>
      ${evs.map(ev => `<span class="evento-pill evento-${ev.tipo}" title="${escapeHtml(ev.titulo)}">${escapeHtml(ev.titulo)}</span>`).join('')}
    </div>`;
  }
  grade.innerHTML = html;
}

      <div id="ne-upload-status" style="font-size:12px;color:#64748b;margin-top:4px;"></div>
    </div>
  `;
}

async function enviarArquivoUploadEmpresa() {
  const arquivoInput = document.getElementById('ne-logo-file');
  if (!arquivoInput || !arquivoInput.files || !arquivoInput.files[0]) return null;
  const statusEl = document.getElementById('ne-upload-status');
  const formData = new FormData();
  formData.append('file', arquivoInput.files[0]);
  if (statusEl) statusEl.textContent = 'Enviando logo...';
  const resposta = await fetch('/api/upload', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + ESTADO.token },
    body: formData
  });
  const dados = await resposta.json();
  if (!resposta.ok) throw new Error(dados.error || 'Falha ao enviar arquivo.');
  if (statusEl) statusEl.textContent = 'Logo enviada!';
  return dados.url;
}

let CACHE_LISTA_VIDEOS = [];

function podeGerenciarVideo(v) {
  if (ESTADO.usuario.role === 'admin') return true;
  if (ESTADO.usuario.role === 'client_admin') return true;
  if (ESTADO.usuario.role === 'mentor') return String(v.mentor_id) === String(ESTADO.usuario.mentorId);
  return false;
}

function textoCompartilhamento(v) {
  return `🚀 Confira essa videoaula "${v.title}" na Academy Digital Impulsionar V4! Desenvolvimento de liderança e alta performance com a marca Impulsionar. ${window.location.origin}`;
}

async function renderVideos() {

    cont.innerHTML = `

  }
}

function renderCardVideo(v) {
  const linkWhats = 'https://wa.me/?text=' + encodeURIComponent(textoCompartilhamento(v));
  const gerenciar = podeGerenciarVideo(v);
  return `
    <div class="card-video" id="card-video-${v.id}">
      <div class="card-video-cabecalho">
        <div>
          <h3>${escapeHtml(v.title)}</h3>
          <div class="card-video-meta">${escapeHtml(v.module_name || 'Academy Digital')} · por ${escapeHtml(v.posted_by || v.mentorName || 'Consultoria Impulsionar')} ${v.duration ? '· ' + escapeHtml(v.duration) : ''}</div>
        </div>
        ${gerenciar ? `<div class="card-video-acoes-admin">
          <button class="btn-secundario btn-sm" onclick="mostrarFormularioVideo(${v.id})">Editar</button>
          <button class="btn-perigo btn-sm" onclick="excluirVideo(${v.id})">Excluir</button>
        </div>` : ''}
      </div>
      ${v.description ? `<p class="card-video-descricao">${escapeHtml(v.description)}</p>` : ''}
      <div class="card-video-player">
        ${renderPlayerVideo(v.video_url, v.thumbnail_url)}
      </div>
      <div class="card-video-interacao">
        <button class="btn-curtir ${v.curtiuEu ? 'curtido' : ''}" onclick="alternarCurtidaVideo(${v.id})">
          ${v.curtiuEu ? '❤️' : '🤍'} <span>${v.totalLikes || 0}</span>
        </button>
        <button class="btn-comentar" onclick="alternarComentarios(${v.id})">💬 <span>${v.totalComments || 0}</span> Comentários</button>
        <a class="btn-compartilhar" href="${linkWhats}" target="_blank" rel="noopener">📲 WhatsApp</a>
        <button class="btn-compartilhar" onclick="compartilharInstagram(${v.id})">📷 Instagram</button>
      </div>
      <div id="comentarios-${v.id}" class="area-comentarios" style="display:none;">
        <div class="lista-comentarios" id="lista-comentarios-${v.id}">Carregando...</div>
        <div class="novo-comentario">
          <input id="input-comentario-${v.id}" placeholder="Escreva um comentário...">
          <button class="btn-primario btn-sm" onclick="enviarComentario(${v.id})">Enviar</button>
        </div>
      </div>
    </div>
  `;
}

function renderPlayerVideo(url, thumb) {
  if (!url) return '';
  const ehArquivoLocal = url.startsWith('/uploads/');
  if (ehArquivoLocal) {

  const formData = new FormData();
  formData.append('file', arquivoInput.files[0]);
  if (statusEl) statusEl.textContent = 'Enviando vídeo...';

    method: 'POST',

  });

  if (!resposta.ok) throw new Error(dados.error || 'Falha ao enviar arquivo.');

  return dados.url;
}

function formatarDataBr(dataIso) {
  const [ano, mes, dia] = dataIso.split('-');
  return `${dia}/${mes}/${ano}`;
}

function renderListaHorariosMentor() {
  const cont = document.getElementById('nm-lista-horarios');
  if (!cont) return;
  if (SLOTS_MENTOR_ATUAL.length === 0) {
    cont.innerHTML = '<p style="font-size:12px;color:#64748b;">Nenhum horário cadastrado ainda.</p>';
    return;
  }
  const ordenado = [...SLOTS_MENTOR_ATUAL].sort((a, b) => a.specific_date.localeCompare(b.specific_date) || a.start_time.localeCompare(b.start_time));
  cont.innerHTML = `<div style="max-height:220px;overflow-y:auto;">` + ordenado.map(s => {
    const indiceReal = SLOTS_MENTOR_ATUAL.indexOf(s);
    return `
    <div style="display:flex;align-items:center;gap:10px;padding:6px 10px;background:#f8fafc;border-radius:8px;margin-bottom:6px;font-size:13px;">
      <span style="flex:1;">${formatarDataBr(s.specific_date)} (${DIAS_SEMANA[s.day_of_week]}) · ${escapeHtml(s.start_time)} às ${escapeHtml(s.end_time)}</span>
      <button type="button" class="link-excluir-comentario" onclick="removerHorarioMentor(${indiceReal})">remover</button>
    </div>`;
  }).join('') + `</div>`;
}

function adicionarHorarioMentor() {
  const dataIso = document.getElementById('nm-slot-data').value;
  const inicio = document.getElementById('nm-slot-inicio').value;
  const fim = document.getElementById('nm-slot-fim').value;
  if (!dataIso) { mostrarToast('Selecione uma data.', true); return; }
  if (!inicio || !fim) { mostrarToast('Informe o horário de início e fim.', true); return; }
  if (inicio >= fim) { mostrarToast('O horário de início precisa ser antes do horário de fim.', true); return; }
  const [ano, mes, dia] = dataIso.split('-').map(Number);
  const diaSemana = new Date(ano, mes - 1, dia).getDay();
  const jaExiste = SLOTS_MENTOR_ATUAL.some(s => s.specific_date === dataIso && s.start_time === inicio && s.end_time === fim);
  if (jaExiste) { mostrarToast('Esse horário já está cadastrado nessa data.', true); return; }
  SLOTS_MENTOR_ATUAL.push({ specific_date: dataIso, day_of_week: diaSemana, start_time: inicio, end_time: fim });
  renderListaHorariosMentor();
}

function adicionarHorariosEmLote() {
  const de = document.getElementById('nm-lote-de').value;
  const ate = document.getElementById('nm-lote-ate').value;
  const inicio = document.getElementById('nm-lote-inicio').value;
  const fim = document.getElementById('nm-lote-fim').value;
  const diasEscolhidos = [...document.querySelectorAll('.nm-lote-dia:checked')].map(c => parseInt(c.value, 10));
  if (!de || !ate) { mostrarToast('Selecione o período (data inicial e final).', true); return; }
  if (de > ate) { mostrarToast('A data final precisa ser depois da data inicial.', true); return; }
  if (!inicio || !fim || inicio >= fim) { mostrarToast('Informe um horário de início e fim válidos.', true); return; }
  if (diasEscolhidos.length === 0) { mostrarToast('Marque ao menos um dia da semana.', true); return; }

  const [anoDe, mesDe, diaDe] = de.split('-').map(Number);
  const [anoAte, mesAte, diaAte] = ate.split('-').map(Number);
  const cursor = new Date(anoDe, mesDe - 1, diaDe);
  const limite = new Date(anoAte, mesAte - 1, diaAte);
  const pad = n => String(n).padStart(2, '0');
  let adicionados = 0;
  while (cursor <= limite) {
    if (diasEscolhidos.includes(cursor.getDay())) {
      const dataIso = `${cursor.getFullYear()}-${pad(cursor.getMonth() + 1)}-${pad(cursor.getDate())}`;
      const jaExiste = SLOTS_MENTOR_ATUAL.some(s => s.specific_date === dataIso && s.start_time === inicio && s.end_time === fim);
      if (!jaExiste) {
        SLOTS_MENTOR_ATUAL.push({ specific_date: dataIso, day_of_week: cursor.getDay(), start_time: inicio, end_time: fim });
        adicionados++;
      }
    }
    cursor.setDate(cursor.getDate() + 1);
  }
  renderListaHorariosMentor();
  mostrarToast(adicionados > 0 ? `${adicionados} data(s) adicionada(s)!` : 'Nenhuma data nova (já estavam todas cadastradas).');
}

function removerHorarioMentor(indice) {
  SLOTS_MENTOR_ATUAL.splice(indice, 1);

  try { await api('/api/mentors/' + id, { method: 'DELETE' }); mostrarToast('Removido!'); renderMentors(); }
  catch (e) { mostrarToast(e.message, true); }
}

/* ==========================================================
   MENTORIAS (agenda & atas)
   ========================================================== */
let CACHE_LISTA_MENTORIAS = [];

async function renderMentorships() {
  const cont = document.getElementById('conteudo');
  cont.innerHTML = '<h1>Agenda & Atas de Mentoria</h1><p>Carregando...</p>';
  try {
    const lista = await api('/api/mentorships');
    CACHE_LISTA_MENTORIAS = lista;
    let opcoesExec = '', opcoesMentor = '';
    if (ESTADO.usuario.role !== 'autonomous') {
      const execs = await api('/api/employees');
      opcoesExec = '<option value="">Selecione...</option>' + execs.map(e => `<option value="${e.id}">${escapeHtml(e.name)}</option>`).join('');
    }
    let temMentores = false;
    try {
      const mentores = await api('/api/mentors');
      temMentores = mentores.length > 0;
      opcoesMentor = '<option value="">Selecione...</option>' + mentores.map(m => `<option value="${m.id}">${escapeHtml(m.name)}</option>`).join('');
    } catch (e) {}
    cont.innerHTML = `
      <h1>Agenda & Atas de Mentoria</h1>
      ${!temMentores ? `<div class="msg-vazio" style="text-align:left;background:#fff7ed;border-radius:8px;padding:14px 16px;">Nenhum mentor cadastrado ainda. Cadastre um mentor (com os horários disponíveis dele) na aba <strong>Mentores</strong> antes de agendar uma mentoria.</div>` : ''}
      <div class="barra-acoes">
        <div></div>
        <div class="direita">
          <button class="btn-secundario" onclick="window.open('/api/export/mentorships','_blank')">Exportar CSV</button>
          <button class="btn-primario" ${!temMentores ? 'disabled title="Cadastre um mentor primeiro"' : ''} onclick="mostrarFormularioMentoria()">+ Agendar Mentoria</button>
        </div>
      </div>
      <div id="form-area" data-opcoes-exec='${opcoesExec.replace(/'/g, "&#39;")}' data-opcoes-mentor='${opcoesMentor.replace(/'/g, "&#39;")}'></div>
      <table>
        <thead><tr><th>Executivo</th><th>Mentor</th><th>Data</th><th>Tópicos</th><th>Estado</th><th>Ações</th></tr></thead>
        <tbody>
          ${lista.map(m => `
            <tr>
              <td>${escapeHtml(m.execName)}</td>
              <td>${escapeHtml(m.mentorName || '-')}</td>
              <td>${escapeHtml(m.meeting_date)}</td>
              <td>${escapeHtml(m.topics)}</td>
              <td>${escapeHtml(m.status)}</td>
              <td>
                <button class="btn-secundario btn-sm" onclick="mostrarFormularioMentoria(${m.id})">Editar</button>
                <button class="btn-perigo btn-sm" onclick="excluirMentoria(${m.id})">Excluir</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
      ${lista.length === 0 ? '<div class="msg-vazio">Nenhuma mentoria agendada ainda.</div>' : ''}
    `;
  } catch (e) {
    cont.innerHTML = `<h1>Agenda & Atas de Mentoria</h1><div class="msg-vazio">${escapeHtml(e.message)}</div>`;
  }
}

function mostrarFormularioMentoria(id) {
  const area = document.getElementById('form-area');
  const opcoesExec = area.dataset.opcoesExec;
  const opcoesMentor = area.dataset.opcoesMentor;
  const execFixo = ESTADO.usuario.role === 'autonomous';
  const m = id ? CACHE_LISTA_MENTORIAS.find(x => x.id === id) : null;
  area.innerHTML = `
    <div class="formulario">
      <div class="linha">
        ${m ? `<div><label>Executivo</label><input value="${escapeHtml(m.execName)}" disabled></div>`
          : execFixo
            ? `<input type="hidden" id="ng-employee" value="${ESTADO.usuario.employeeId}">`
            : `<div><label>Executivo</label><select id="ng-employee">${opcoesExec}</select></div>`}
        <div><label>Mentor</label><select id="ng-mentor" onchange="carregarHorariosMentoria(this.value)">${opcoesMentor}</select></div>
        ${m
          ? `<div><label>Data da Reunião</label><input id="ng-date" type="datetime-local" value="${escapeHtml((m.meeting_date || '').slice(0,16))}"></div>`
          : `<div style="flex:2"><label>Horário Disponível</label><select id="ng-date-slot"><option value="">Selecione um mentor primeiro</option></select></div>`}
        <div><label>Tópicos</label><input id="ng-topics" value="${escapeHtml(m?.topics || '')}"></div>
        ${m ? `<div><label>Atas/Notas</label><input id="ng-minutes" value="${escapeHtml(m.minutes || '')}"></div>
               <div><label>Estado</label><select id="ng-status">
                 ${['Agendada','Realizada','Cancelada'].map(o => `<option ${m.status === o ? 'selected' : ''}>${o}</option>`).join('')}
               </select></div>` : ''}
      </div>
      <div class="acoes-form">
        <button class="btn-primario" onclick="salvarMentoria(${m ? m.id : 'null'})">${m ? 'Salvar Alterações' : 'Agendar'}</button>
        <button class="btn-secundario" onclick="renderMentorships()">Cancelar</button>
      </div>
    </div>
  `;
  if (m) {
    setTimeout(() => { document.getElementById('ng-mentor').value = m.mentor_id; }, 0);
  }
}

async function carregarHorariosMentoria(mentorId) {
  const selectData = document.getElementById('ng-date-slot');
  if (!selectData) return;
  if (!mentorId) { selectData.innerHTML = '<option value="">Selecione um mentor primeiro</option>'; return; }
  selectData.innerHTML = '<option value="">Carregando horários...</option>';
  try {
    const slots = await api('/api/mentors/' + mentorId + '/availability');
    const agora = new Date();
    const pad = n => String(n).padStart(2, '0');
    const hojeIso = `${agora.getFullYear()}-${pad(agora.getMonth() + 1)}-${pad(agora.getDate())}`;
    const agoraHM = `${pad(agora.getHours())}:${pad(agora.getMinutes())}`;
    const futuros = slots
      .filter(s => s.specific_date > hojeIso || (s.specific_date === hojeIso && s.start_time > agoraHM))
      .sort((a, b) => a.specific_date.localeCompare(b.specific_date) || a.start_time.localeCompare(b.start_time));
    if (!futuros.length) {
      selectData.innerHTML = '<option value="">Este mentor não tem horários futuros cadastrados</option>';
      return;
    }
    selectData.innerHTML = '<option value="">Selecione...</option>' + futuros.map(s => {
      const valor = `${s.specific_date}T${s.start_time}`;
      const rotulo = `${formatarDataBr(s.specific_date)} (${DIAS_SEMANA[s.day_of_week]}) — ${s.start_time} às ${s.end_time}`;
      return `<option value="${valor}">${escapeHtml(rotulo)}</option>`;
    }).join('');
  } catch (e) {
    selectData.innerHTML = '<option value="">Erro ao carregar horários</option>';
  }
}

async function salvarMentoria(id) {
  try {
    if (id) {
      const mentorId = document.getElementById('ng-mentor').value;
      const dataReuniao = document.getElementById('ng-date').value;
      if (!mentorId) { mostrarToast('Selecione o mentor.', true); return; }
      if (!dataReuniao) { mostrarToast('Informe a data da reunião.', true); return; }
      const corpo = {
        mentor_id: mentorId,
        meeting_date: dataReuniao,
        topics: document.getElementById('ng-topics').value,
        minutes: document.getElementById('ng-minutes').value,
        status: document.getElementById('ng-status').value
      };
      await api('/api/mentorships/' + id, { method: 'PUT', body: JSON.stringify(corpo) });
      mostrarToast('Mentoria atualizada!');
    } else {
      const employeeId = document.getElementById('ng-employee').value;
      const mentorId = document.getElementById('ng-mentor').value;
      const dataSlot = document.getElementById('ng-date-slot').value;
      const topicos = document.getElementById('ng-topics').value;
      if (!employeeId) { mostrarToast('Selecione o executivo.', true); return; }
      if (!mentorId) { mostrarToast('Selecione o mentor.', true); return; }
      if (!dataSlot) { mostrarToast('Selecione um horário disponível do mentor.', true); return; }
      if (!topicos) { mostrarToast('Informe os tópicos da mentoria.', true); return; }
      const corpo = { employee_id: employeeId, mentor_id: mentorId, meeting_date: dataSlot, topics: topicos };
      await api('/api/mentorships', { method: 'POST', body: JSON.stringify(corpo) });
      mostrarToast('Mentoria agendada!');
    }
    renderMentorships();
  } catch (e) { mostrarToast(e.message, true); }
}

async function excluirMentoria(id) {
  if (!confirm('Remover esta mentoria?')) return;
  try { await api('/api/mentorships/' + id, { method: 'DELETE' }); mostrarToast('Removido!'); renderMentorships(); }
  catch (e) { mostrarToast(e.message, true); }
}

/* ==========================================================
   COMPETENCE CHECK (assessments)
   ========================================================== */
let CACHE_LISTA_ASSESSMENTS = [];
const OPCOES_COMPETENCIA = ['Visão Estratégica & Negócios','Liderança Transformacional & Pessoas','Orientação para Resultados & Governança','Gestão de Crises & Inovação'];

    const lista = await api('/api/assessments');

    if (ESTADO.usuario.role !== 'autonomous') {
      const execs = await api('/api/employees');
      opcoesExec = execs.map(e => `<option value="${e.id}">${escapeHtml(e.name)}</option>`).join('');
    }
    cont.innerHTML = `
      <h1>Competence Check</h1>
      <div class="barra-acoes">
        <div></div>
        <div class="direita">
          <button class="btn-secundario" onclick="window.open('/api/export/assessments','_blank')">Exportar CSV</button>
          ${ESTADO.usuario.role !== 'autonomous' ? '<button class="btn-primario" onclick="mostrarFormularioAssessment()">+ Novo Assessment</button>' : ''}
        </div>
      </div>
      <div id="form-area" data-opcoes-exec='${opcoesExec.replace(/'/g, "&#39;")}'></div>
      <table>
        <thead><tr><th>Executivo</th><th>Competência</th><th>Pontuação</th><th>Parecer</th><th>Ações</th></tr></thead>
        <tbody>
          ${lista.map(a => `
            <tr>

              <td>${escapeHtml(a.score)}</td>

              <td>${ESTADO.usuario.role !== 'autonomous' ? `

            </tr>`).join('')}

    `;
  } catch (e) {
    cont.innerHTML = `<h1>Competence Check</h1><div class="msg-vazio">${escapeHtml(e.message)}</div>`;
  }
}

function mostrarFormularioAssessment(id) {
  const area = document.getElementById('form-area');
  const opcoesExec = area.dataset.opcoesExec;
  const a = id ? CACHE_LISTA_ASSESSMENTS.find(x => x.id === id) : null;
  area.innerHTML = `
    <div class="formulario">
      <div class="linha">
        ${a ? `<div><label>Executivo</label><input value="${escapeHtml(a.employeeName || '')}" disabled></div>`
             : `<div><label>Executivo</label><select id="na-employee">${opcoesExec}</select></div>`}
        <div><label>Competência</label>
          <select id="na-competence">
            ${OPCOES_COMPETENCIA.map(o => `<option ${a?.leadership_competence === o ? 'selected' : ''}>${o}</option>`).join('')}
          </select>
        </div>
        <div><label>Pontuação (0-100)</label><input id="na-score" type="number" min="0" max="100" value="${a?.score ?? ''}"></div>
      </div>
      <div class="acoes-form">
        <button class="btn-primario" onclick="salvarAssessment(${a ? a.id : 'null'})">${a ? 'Salvar Alterações' : 'Registar'}</button>
        <button class="btn-secundario" onclick="renderAssessments()">Cancelar</button>
      </div>
    </div>
  `;
}

async function salvarAssessment(id) {
  try {
    if (id) {
      const corpo = {
        leadership_competence: document.getElementById('na-competence').value,
        score: document.getElementById('na-score').value
      };
      await api('/api/assessments/' + id, { method: 'PUT', body: JSON.stringify(corpo) });
      mostrarToast('Assessment atualizado!');
    } else {
      const corpo = {
        employee_id: document.getElementById('na-employee').value,
        leadership_competence: document.getElementById('na-competence').value,
        score: document.getElementById('na-score').value
      };
      await api('/api/assessments', { method: 'POST', body: JSON.stringify(corpo) });
      mostrarToast('Assessment registado!');
    }
    renderAssessments();
  } catch (e) { mostrarToast(e.message, true); }
}

async function excluirAssessment(id) {
  if (!confirm('Remover este assessment?')) return;
  try { await api('/api/assessments/' + id, { method: 'DELETE' }); mostrarToast('Removido!'); renderAssessments(); }
  catch (e) { mostrarToast(e.message, true); }
}
