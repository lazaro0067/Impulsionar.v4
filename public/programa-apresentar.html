<style id="css-sl">

  .mapa .pt { position:absolute; text-align:center; transform:translate(-50%, -50%); } .mapa .pt i { display:grid; place-items:center; width:3em; height:3em; margin:0 auto .4em; border-radius:50%; background:var(--ambar); color:var(--navy); font-style:normal; font-weight:900; font-size:1.6em; box-shadow:0 0 0 .4em rgba(245,158,11,.25); }

  .qrbox { display:flex; gap:2.6em; align-items:center; margin-top:.6em; } .qrbox img { width:15em; height:15em; background:#fff; border-radius:.8em; padding:.6em; }
  .qrs { display:flex; gap:2.4em; margin-top:.6em; } .qrs div { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15); border-radius:1.2em; padding:1.2em 1.6em; text-align:center; }
  .qrs img { width:8.5em; height:8.5em; background:#fff; border-radius:.6em; padding:.4em; display:block; margin:0 auto .7em; } .qrs b { display:block; font-size:1.4em; } .qrs small { color:#94a3b8; font-size:1em; }
  .fb { display:grid; grid-template-columns:repeat(3, 1fr); gap:1.2em; margin-top:1.2em; } .fb div { border-radius:1.1em; padding:1.5em; background:rgba(255,255,255,.07); border-top:.35em solid var(--verde); } .fb div:nth-child(2) { border-color:var(--ambar); } .fb div:nth-child(3) { border-color:#60a5fa; }
  .fb b { display:block; font-size:1.7em; } .fb small { font-size:1.2em; color:#cbd5e1; }

  .slide { padding:10% 8% 15%; }

  .faixa div span { position:absolute; left:0; top:.8em; white-space:nowrap; font-size:.9em; font-weight:700; color:#94a3b8; letter-spacing:.04em; } .faixa div.on span { color:var(--ambar); font-weight:900; }
  .claro .faixa div { background:#e2e8f0; } .claro .faixa div.on { background:var(--ambar); }

<body>
<div class="prog" id="prog"></div>
<div class="relogio" id="relogio">00:00</div>
<div class="ctl"><select id="sel-enc" onchange="trocarEncontro(this.value)" title="Encontro"></select><button onclick="ir(-1)">←</button><button onclick="ir(1)">→</button><button class="cel" id="bt-cel" onclick="abrirPassador()">📱 Passador (P)</button><button onclick="alternarNotas()">📝 Notas (N)</button><button onclick="telaCheia()">⛶ Tela cheia (F)</button></div>
<div class="palco" id="palco"></div>
<div class="notas" id="notas"></div>
<div class="passa" id="passa"><div id="passa-c"></div></div>
<div class="aviso" id="aviso"></div>
<script>
const AP = { i: 0, slides: [], inicio: null, cron: null, cronEl: null };
const Q = new URLSearchParams(location.search);
const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const qr = u => `https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=8&data=${encodeURIComponent(u)}`;
function partir(t) { t = String(t || ''); const m = t.match(/^(.{6,90}?)(?::\s|\.\s|\s·\s)(.+)$/); return m ? { h: cap(m[1].replace(/\.$/, '')), s: cap(m[2]) } : { h: cap(t), s: '' }; }
const cap = t => { t = String(t || ''); return t.charAt(0).toUpperCase() + t.slice(1); };
const minutos = t => { const m = String(t || '').match(/(\d+)\s*min/); return m ? Number(m[1]) : 0; };
const mm = m => String(m).padStart(2, '0');
const BLOCOS_PADRAO = [['Abertura', 5], ['Conceito', 15], ['Demonstração', 5], ['Prática', 30], ['Fechamento', 5]];
(async () => {
  let d; try { d = await (await fetch('/api/public/mentoria/programa/' + encodeURIComponent(Q.get('p') || 'comunicacao-impacto'), { cache: 'no-store' })).json(); if (d.error) throw new Error(d.error); }
  catch (e) { document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif">Não consegui carregar a apresentação.</p>'; return; }
  const p = d.programa, m = d.marca, temPrep = !!p.preparacao;
  const n = Math.min(p.encontros.length, Math.max(temPrep ? 0 : 1, Q.get('e') === null ? 1 : Number(Q.get('e')) || 0));
  const prep = n === 0, e = prep ? Object.assign({ n: 0 }, p.preparacao) : p.encontros[n - 1], ant = n > 1 ? p.encontros[n - 2] : null, prox = p.encontros[n];
  AP.prog = p; AP.n = n;
  document.title = `${prep ? 'Preparação' : 'Encontro ' + n} · ${p.nome}`;
  document.getElementById('sel-enc').innerHTML = (temPrep ? [`<option value="0" ${prep ? 'selected' : ''}>Preparação</option>`] : []).concat(p.encontros.map(x => `<option value="${x.n}" ${x.n === n ? 'selected' : ''}>Encontro ${x.n}</option>`)).join('');
  const igE = String(m.instagramEmpresa || 'impulsionarv4').replace(/^@/, ''), igL = String(m.instagram || 'lazaroneto.oficial').replace(/^@/, ''), emp = m.empresa || 'Impulsionar V4', turma = Q.get('t') || '';
  const nomeEnc = prep ? 'Preparação' : `Encontro ${n}`;
  const logo = `<div class="logo"><div class="v4"><b>V4</b><i>↗</i></div><span>IMPULSIONAR<small>GESTÃO &amp; PESSOAS</small></span></div>`;
  const selo = `<div class="selo">${prep ? 'Preparação · 1 hora' : `Encontro ${n} de ${p.encontros.length} · 1 hora`}</div>`;
  // blocos do encontro com os minutos planejados (00–05, 05–20…)
  const B = (e.blocos || BLOCOS_PADRAO).map(b => ({ nome: b[0], min: Number(b[1]) || 5 })); let t0 = 0; B.forEach(b => { b.ini = t0; b.fim = t0 + b.min; t0 = b.fim; });
  const bi = nome => Math.max(0, B.findIndex(b => b.nome === nome));
  const faixa = k => `<div class="faixa">${B.map((b, j) => `<div class="${j === k ? 'on' : j < k ? 'feito' : ''}" style="flex:${b.min}">${j === k ? `<span>▶ ${esc(b.nome)} · ${mm(b.ini)}–${mm(b.fim)} min</span>` : ''}</div>`).join('')}</div>`;
  const rod = k => `${logo}${selo}${faixa(k)}<div class="rod"><span>${esc(p.curto || p.nome)}${turma ? ' · ' + esc(turma) : ''}</span><span>${esc(m.mentor)} · Consultor ${esc(emp)}</span></div>`;
  const chip = k => `<div class="chip">${esc(B[k].nome.toUpperCase())} · ${B[k].min} MIN · ${mm(B[k].ini)}–${mm(B[k].fim)}</div>`;
  const cronH = (min, txt) => `<div class="cron" data-seg="${min * 60}">${mm(min)}:00<small>${txt || 'CONTANDO SOZINHO · T REINICIA'}</small></div>`;
  const S = [], add = (k, titulo, html, notas, claro) => S.push({ bloco: k, titulo, html: html + rod(k), notas, claro });
  const gapsDia = prep ? [] : (p.gaps || []).filter(g => String(e.gaps || '').includes('todos') || String(e.gaps || '').split(/\D+/).includes(String(g.n)) || Number(g.principal) === n);
  // ===== 1. Capa
  add(0, 'Capa', `<div class="k">${esc(p.nome)}${turma ? ' · ' + esc(turma) : ''}</div><div style="font-size:1.6em;font-weight:800;color:#cbd5e1;margin-bottom:.4em">${nomeEnc} · 1 hora</div><h1>${esc(e.modulo)}</h1><div class="sub">${esc(e.tema)}</div>`,
    `DIGA: "Bom dia, pessoal. Hoje são 60 minutos e todo mundo vai apresentar." • FAÇA: confira se todos estão com o celular para gravar. Comece no horário.`);
  // ===== 2. Objetivo do dia (o que eles levam)
  add(0, 'Objetivo de hoje', `<div class="k">No fim desta hora, você vai</div><ul class="faca">${(e.objetivo || [e.tema]).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`,
    `DIGA: "No fim desta hora, cada um de vocês vai…" e leia os itens. • FAÇA: peça para alguém repetir o 1º item com as próprias palavras.`);
  // ===== 3. Agenda de 60 minutos
  const desc = { 'Abertura': n > 1 ? 'Retomada da tarefa de casa' : 'Combinados e boas-vindas', 'Conceito': 'Uma ideia por slide, com exemplo real', 'Demonstração': 'Eu faço ao vivo', 'Prática': 'Todos apresentam e recebem feedback', 'Fechamento': 'Tarefa, presença e próximo encontro', 'Apresentações': '4 minutos + 1 pergunta da banca', 'Boas-vindas': 'Quem somos e por que estamos aqui', 'O programa': 'Os encontros e a entrega final', 'Combinados': 'Como a turma funciona', 'Ponto de partida': 'Cada um diz a sua apresentação real e a sua nota', 'Próximos passos': 'O que trazer no Encontro 1' };
  add(0, 'Agenda de hoje', `<div class="k">Agenda de hoje · 60 minutos</div><div class="agenda">${B.map(b => `<div><b>${mm(b.ini)}–${mm(b.fim)}</b><span>${esc(b.nome)}<small>${esc(desc[b.nome] || '')}</small></span><i>${b.min} min</i></div>`).join('')}</div>`,
    `DIGA: "Esse é o nosso relógio de hoje." • A faixa embaixo de todo slide mostra em que bloco estamos. Se um bloco atrasar, corte do Conceito, nunca da Prática.`);
  if (prep) {
    // ===== PREPARAÇÃO (encontro de alinhamento, 1 h)
    add(bi('Boas-vindas'), 'Por que estamos aqui', `${chip(bi('Boas-vindas'))}<div class="grande">Quem apresenta bem <em style="font-style:normal;color:var(--ambar)">lidera melhor</em>.</div><div class="sub">O time decide em 30 segundos se vai prestar atenção em você. Este programa treina esses 30 segundos — e o resto.</div>`,
      'DIGA: conte em 1 minuto uma apresentação sua que deu errado e o que aprendeu. • PERGUNTE: "Quem aqui já ficou nervoso antes de apresentar?" (mãos levantadas quebram o gelo).');

    + `.pa-mini { position:relative; width:100%; height:100%; overflow:hidden; font-family:Montserrat, system-ui, sans-serif; color:#fff; } .pa-mini .slide { position:absolute; inset:0; width:100%; height:100%; font-size:.75em; opacity:1; transform:none; }`;
  return CSS_MINI;
}
function enviarEstado() {
  if (!PS.socket || !PS.socket.connected || !AP.slides.length) return;

  const s = AP.slides[AP.i], B = s ? s.bloco : 0;
  PS.socket.emit('mt-estado', { i: AP.i, total: AP.slides.length, titulo: s.titulo, modulo: (document.querySelector('.slide.on .faixa .on span') || {}).textContent || '', notas: String(s.notas || '').replace(/ • /g, '\n• '), proximo: (AP.slides[AP.i + 1] || {}).titulo || '', ini: AP.inicio, css: cssMini(), telas: [tela(AP.i), tela(AP.i + 1), tela(AP.i + 2)] });
}
