<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slides do encontro · Área do Aluno</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1329">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; background:#0b1329; color:#fff; font-family:Montserrat, system-ui, sans-serif; min-height:100%; }
  .topo { display:flex; gap:12px; align-items:center; padding:12px 16px; border-bottom:1px solid rgba(255,255,255,.08); }
  .topo a { color:#fbbf24; font-weight:800; text-decoration:none; font-size:14px; white-space:nowrap; }
  .topo div { flex:1; min-width:0; } .topo b { display:block; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .topo small { color:#94a3b8; font-size:12px; }
  .palco { max-width:1100px; margin:0 auto; padding:16px; }
  .sl { position:relative; width:100%; aspect-ratio:16/9; border-radius:14px; overflow:hidden; background:#fff; color:#0f172a; box-shadow:0 20px 50px rgba(0,0,0,.4); }
  .sl.img { background:#0b1329 center/contain no-repeat; }
  .sl .txt { position:absolute; inset:0; padding:6% 7%; display:grid; grid-template-columns:1.2fr 1fr; gap:4%; align-items:center; border-left:10px solid #7c3aed; }
  .sl .txt.so { grid-template-columns:1fr; }
  .sl h2 { margin:0 0 .6em; font-size:clamp(18px, 3.4vw, 40px); line-height:1.12; font-weight:900; }
  .sl ul { margin:0; padding:0; list-style:none; display:grid; gap:.55em; font-size:clamp(13px, 2vw, 24px); font-weight:600; color:#334155; } .sl li { padding-left:1.1em; position:relative; } .sl li::before { content:''; position:absolute; left:0; top:.45em; width:.5em; height:.5em; border-radius:50%; background:#7c3aed; }
  .sl figure { margin:0; height:100%; display:grid; place-items:center; } .sl figure img { max-width:100%; max-height:78%; border-radius:12px; object-fit:cover; box-shadow:0 10px 30px rgba(15,23,42,.18); }
  .nav { display:flex; gap:10px; align-items:center; justify-content:center; margin-top:14px; } .nav button { font:inherit; font-weight:800; border:none; border-radius:999px; padding:12px 22px; cursor:pointer; background:#1e293b; color:#fff; font-size:16px; } .nav button.pri { background:#f59e0b; color:#0b1329; } .nav button:disabled { opacity:.35; }
  .nav span { color:#94a3b8; font-weight:700; min-width:70px; text-align:center; }
  .secao { text-align:center; color:#fbbf24; font-size:12px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; margin-top:10px; }
  .msg { max-width:520px; margin:80px auto; text-align:center; padding:20px; color:#cbd5e1; }
  @media (max-width:640px) { .sl .txt { grid-template-columns:1fr; } .sl figure { display:none; } .palco { padding:10px; } }
</style>
</head>
<body>
<div id="app"><p class="msg">Carregando os slides…</p></div>
<script>
const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const m = location.pathname.match(/\/aluno\/([a-f0-9]{32})\/encontro\/(\d+)/) || [], TOKEN = m[1], N = m[2];
let D = null, I = 0;
(async () => {
  const r = await fetch(`/api/public/aluno/${TOKEN}/encontro/${N}/slides`, { cache: 'no-store' }), j = await r.json().catch(() => ({}));
  if (!r.ok) { document.getElementById('app').innerHTML = `<div class="msg"><div style="font-size:48px">🔒</div><p>${esc(j.error || 'Não consegui abrir os slides.')}</p><a href="/aluno/${TOKEN}" style="color:#fbbf24;font-weight:800">← Voltar para a minha área</a></div>`; return; }
  D = j; I = Math.max(0, Math.min(D.slides.length - 1, (Number(location.hash.slice(1)) || 1) - 1)); desenhar();
})();
function slideHtml(s) {
  if (s.layout === 'imagem') return `<div class="sl img" style="background-image:url('${esc(s.imagem)}')"></div>`;
  const itens = String(s.texto || '').split('\n').map(x => x.replace(/^•\s*/, '').trim()).filter(Boolean);
  return `<div class="sl"><div class="txt ${s.imagem ? '' : 'so'}"><div><h2>${esc(s.titulo)}</h2>${itens.length ? `<ul>${itens.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</div>${s.imagem ? `<figure><img src="${esc(s.imagem)}" alt=""></figure>` : ''}</div></div>`;
}
function desenhar() {
  const s = D.slides[I];
  document.getElementById('app').innerHTML = `<div class="topo"><a href="/aluno/${TOKEN}">← Minha área</a><div><b>Encontro ${D.encontro} · ${esc(D.modulo)}</b><small>${esc(D.programa)}</small></div></div>
    <div class="palco">${slideHtml(s)}<div class="secao">${esc(s.secao || '')}</div>
      <div class="nav"><button onclick="ir(-1)" ${I === 0 ? 'disabled' : ''}>◀</button><span>${I + 1} / ${D.slides.length}</span><button class="pri" onclick="ir(1)" ${I === D.slides.length - 1 ? 'disabled' : ''}>Próximo ▶</button></div></div>`;
  history.replaceState(null, '', '#' + (I + 1));
  const prox = D.slides[I + 1]; if (prox && prox.imagem) { const im = new Image(); im.src = prox.imagem; }
}
function ir(d) { const n = I + d; if (n < 0 || n >= D.slides.length) return; I = n; desenhar(); }
document.addEventListener('keydown', e => { if (['ArrowRight', ' ', 'PageDown'].includes(e.key)) ir(1); else if (['ArrowLeft', 'PageUp'].includes(e.key)) ir(-1); });
let x0 = null; document.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) ir(dx < 0 ? 1 : -1); x0 = null; });
</script>
</body>
</html>
