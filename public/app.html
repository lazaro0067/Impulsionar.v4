<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baixar o app Impulsionar</title>
<meta name="description" content="Instale o Impulsionar V4 no seu celular: ícone na tela inicial, abre em tela cheia.">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b1329">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/app-icone-32.png?v=1">
<link rel="apple-touch-icon" href="/assets/app-icone-180.png?v=1">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Impulsionar">
<meta property="og:title" content="Baixe o app Impulsionar V4"><meta property="og:image" content="https://www.impulsionarv4.com.br/assets/app-icone-512.png?v=1">
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color:#e2e8f0;
    background:radial-gradient(700px 420px at 15% -10%, rgba(34,197,94,.28), transparent 60%), radial-gradient(600px 400px at 110% 110%, rgba(37,99,235,.28), transparent 60%), #070b18; }
  .cx { max-width:460px; margin:0 auto; padding:40px 20px 48px; text-align:center; }
  .icone { width:112px; height:112px; border-radius:26px; box-shadow:0 18px 50px rgba(34,197,94,.25); }
  h1 { font-size:28px; margin:18px 0 6px; color:#fff; } .sub { color:#94a3b8; margin:0 0 24px; font-size:15px; line-height:1.5; }
  .bt { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; border:none; border-radius:16px; padding:18px; font:inherit; font-size:18px; font-weight:800; cursor:pointer; text-decoration:none; color:#06281a;
    background:linear-gradient(135deg,#22c55e,#14b8a6); box-shadow:0 14px 34px rgba(34,197,94,.35); }
  .bt.sec { background:rgba(255,255,255,.08); color:#e2e8f0; box-shadow:none; border:1px solid rgba(255,255,255,.16); font-size:15px; padding:14px; margin-top:10px; }
  .caixa { background:rgba(15,23,42,.75); border:1px solid rgba(255,255,255,.1); border-radius:20px; padding:18px; margin-top:18px; text-align:left; }
  .caixa h3 { margin:0 0 8px; color:#fff; font-size:16px; } .caixa ol { margin:0; padding-left:22px; line-height:1.75; font-size:15px; } .caixa p { margin:8px 0 0; color:#94a3b8; font-size:13.5px; }
  .ok { background:rgba(34,197,94,.12); border-color:rgba(74,222,128,.45); } .alerta { background:rgba(245,158,11,.12); border-color:rgba(245,158,11,.45); }
  .vant { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:22px; } .vant div { background:rgba(255,255,255,.05); border-radius:14px; padding:12px 6px; font-size:12.5px; color:#cbd5e1; } .vant b { display:block; font-size:22px; margin-bottom:4px; }
  .ic { display:inline-block; background:rgba(255,255,255,.12); border-radius:6px; padding:0 6px; }
  .rodape { margin-top:26px; font-size:12px; color:#64748b; } .rodape a { color:#4ade80; }
</style>
</head>
<body>
<div class="cx">
  <img class="icone" src="/assets/app-icone-192.png?v=1" alt="Impulsionar">
  <h1>App Impulsionar V4</h1>
  <p class="sub">Gestão de processos e desenvolvimento de pessoas, direto da tela inicial do seu celular.</p>
  <div id="area"></div>
  <div class="vant"><div><b>⚡</b>Abre direto, em tela cheia</div><div><b>🔔</b>Alertas da sua agenda</div><div><b>🔐</b>Fica logado com segurança</div></div>
  <div class="rodape">Prefere usar pelo navegador? <a href="/">Entrar no Impulsionar</a></div>
</div>
<script>
const UA = navigator.userAgent;
const ehIos = /iphone|ipad|ipod/i.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const ehAndroid = /Android/i.test(UA), ehCelular = ehIos || ehAndroid || /Mobile/i.test(UA);
const noApp = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const interno = /Instagram|FBAN|FBAV|FB_IAB|Line\/|LinkedInApp|TikTok|musical_ly|Snapchat|; wv\)/i.test(UA);
const ehSafari = ehIos && /Safari/i.test(UA) && !/CriOS|FxiOS|EdgiOS|OPiOS/i.test(UA);
let pedido = null, jaInstalado = false;
const area = document.getElementById('area');
function desenhar() {
  if (noApp) { area.innerHTML = `<div class="caixa ok"><h3>✅ Você já está no app</h3><p>O Impulsionar está instalado neste aparelho. Toque abaixo para entrar.</p></div><a class="bt" style="margin-top:14px;" href="/?app=1">Abrir o Impulsionar</a>`; return; }
  if (interno) {
    area.innerHTML = `<div class="caixa alerta"><h3>Abra no navegador para instalar</h3><ol><li>Toque no menu <b>⋮</b> ou <b>…</b> no canto da tela.</li><li>Escolha <b>Abrir no navegador</b> (Chrome ou Safari).</li><li>Lá, toque em <b>📲 Baixar o app</b>.</li></ol><p>Dentro do Instagram, WhatsApp ou Facebook o celular não deixa instalar aplicativos.</p></div>
      <button class="bt sec" onclick="copiar()">Copiar o link</button>`; return;
  }
  if (jaInstalado) { area.innerHTML = `<div class="caixa ok"><h3>✅ O app já está instalado neste celular</h3><p>Procure o ícone <b>Impulsionar</b> (V4) na tela inicial ou na gaveta de apps.</p></div><a class="bt sec" href="/?app=1">Continuar pelo navegador</a>`; return; }
  if (pedido) { area.innerHTML = `<button class="bt" onclick="instalar()">📲 Baixar o app</button><p class="sub" style="margin:10px 0 0;font-size:13px;">Grátis · leve · instala em segundos</p>`; return; }
  if (ehIos) {
    area.innerHTML = `${ehSafari ? '' : `<div class="caixa alerta"><h3>Use o Safari</h3><p>No iPhone, só o <b>Safari</b> instala apps de sites. Copie o link e abra no Safari.</p></div><button class="bt sec" onclick="copiar()">Copiar o link</button>`}
      <div class="caixa"><h3>📲 Instalar no iPhone (30 segundos)</h3><ol><li>Toque em <b>Compartilhar</b> <span class="ic">⬆️</span> na barra de baixo do Safari.</li><li>Role e toque em <b>Adicionar à Tela de Início</b>.</li><li>Toque em <b>Adicionar</b>.</li></ol><p>O ícone V4 aparece na tela do iPhone. Abra por ele para receber os alertas da agenda.</p></div>`; return;
  }
  if (ehAndroid) {
    area.innerHTML = `<button class="bt" onclick="ajudaAndroid()">📲 Baixar o app</button>
      <div class="caixa" id="ajuda" style="display:none;"><h3>Instalar no Android</h3><ol><li>Toque no menu <b>⋮</b> no canto de cima do Chrome.</li><li>Toque em <b>Instalar app</b> (ou <b>Adicionar à tela inicial</b> › <b>Instalar</b>).</li><li>Confirme. O ícone V4 aparece na tela inicial.</li></ol><p>Se aparecer <b>Abrir app</b>, ele já está instalado: procure o ícone Impulsionar.</p><p>No Samsung Internet: menu <b>≡</b> › <b>Adicionar página a</b> › <b>Tela inicial</b>.</p></div>`; return;
  }
  area.innerHTML = `<div class="caixa"><h3>📱 Para instalar no celular</h3><ol><li>Abra <b>impulsionarv4.com.br/app</b> no celular (Chrome no Android, Safari no iPhone).</li><li>Toque em <b>📲 Baixar o app</b>.</li></ol></div>
    <div class="caixa"><h3>💻 Para instalar neste computador</h3><p style="color:#cbd5e1;">No Chrome ou Edge, clique no ícone de instalar <span class="ic">⊕</span> na barra de endereço ou no menu <b>⋮</b> › <b>Transmitir, salvar e compartilhar</b> › <b>Instalar página como app</b>.</p></div>`;
}
function ajudaAndroid() { if (pedido) return instalar(); const a = document.getElementById('ajuda'); if (a) { a.style.display = ''; a.scrollIntoView({ behavior: 'smooth' }); } }
async function instalar() {
  if (!pedido) return ajudaAndroid();
  pedido.prompt(); const r = await pedido.userChoice.catch(() => ({})); pedido = null;
  if (r.outcome === 'accepted') area.innerHTML = `<div class="caixa ok"><h3>✅ Instalando…</h3><p>Em instantes o ícone <b>Impulsionar</b> aparece na tela inicial. Abra por ele e faça login.</p></div>`; else desenhar();
}
function copiar() { const u = location.origin + '/app'; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => alertaCurto('Link copiado! Cole no navegador.')).catch(() => prompt('Copie o link:', u)); }
function alertaCurto(t) { const d = document.createElement('div'); d.textContent = t; d.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#22c55e;color:#06281a;font-weight:800;padding:12px 18px;border-radius:12px;z-index:9'; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); pedido = e; desenhar(); });
window.addEventListener('appinstalled', () => { pedido = null; area.innerHTML = `<div class="caixa ok"><h3>✅ App instalado!</h3><p>Abra pelo ícone <b>Impulsionar</b> na tela inicial e faça login.</p></div>`; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
if (navigator.getInstalledRelatedApps) navigator.getInstalledRelatedApps().then(l => { if (l && l.length) { jaInstalado = true; desenhar(); } }).catch(() => {});
desenhar();
</script>
</body>
</html>
