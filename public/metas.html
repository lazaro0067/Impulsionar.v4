<script>

const metaM = (i, m) => { const v = num((i.metas || [])[m]); return v === null ? num(i.metaAno) : v; }, realM = (i, m) => num((i.reais || [])[m]);

function premio(i, m) {

function premioHtml(p) {

    if (!r.ok) { if (!silencioso) { TOPO.innerHTML = `<div class="emp">${esc((j.empresa || {}).nome || 'IMPULSIONAR V4')}</div><h1>🎯 Metas Individuais</h1><p>Link indisponível</p>`; APP.innerHTML = `<div class="card" style="margin-top:8px;"><h2>😕 Não consegui abrir</h2><p class="muted">${esc(j.error || 'Link inválido.')}</p></div>`; } return; }

async function enviar(corpo) {

}

async function validar(ind, mes, pagar, b) {

      ${porPessoa.map(({ l, it }) => it.map((x, k) => `<tr>${k === 0 ? `<td rowspan="${it.length + 1}"><b>${esc(l.nome)}</b><br><span class="muted">${esc(l.cargo || '')}</span></td>` : ''}<td>${esc(x.i.nome)}</td><td>${fmt(metaM(x.i, m), x.i.tipo)}</td><td>${fmt(realM(x.i, m), x.i.tipo)}</td><td>${pct(x.p.a)}</td><td>${st(x)}${x.p.v && x.p.v.just ? `<br><span class="muted">${esc(x.p.v.just)}</span>` : ''}</td><td class="r">${moeda(x.p.aPagar)}</td></tr>`).join('') + `<tr class="sub"><td colspan="5">Total de ${esc(String(l.nome).split(' ')[0])}</td><td class="r"><b>${moeda(it.reduce((s, x) => s + x.p.aPagar, 0))}</b></td></tr>`).join('') || '<tr><td colspan="7" class="muted">Nenhum resultado lançado neste mês.</td></tr>'}
      </tbody><tfoot><tr><td colspan="6">TOTAL DA ÁREA</td><td class="r">${moeda(tot)}</td></tr></tfoot></table></div>
      <div class="rel-ass"><div>Liderança: ${esc(D.area.responsavel || '')}<br>____________________________</div><div>Gente &amp; Gestão<br>____________________________</div></div></div>
    <div class="barra no-print"><button class="bt pri" onclick="window.print()">🖨️ Imprimir / salvar PDF</button><button class="bt" onclick="baixarCsv()">⬇️ Baixar planilha (Excel)</button></div>`;
}
function baixarCsv() {
  const m = V.mes, L = linhasPagamento(m), c = v => '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"', n = v => v === null || v === undefined ? '' : String(v).replace('.', ',');
  const st = { pago: 'Validado', excecao: 'Exceção justificada', naopago: 'Não pago', pendente: 'Pendente de validação' };
  const linhas = [['Empresa', 'Área', 'Liderança', 'Mês', 'Colaborador', 'Cargo', 'Indicador', 'Meta', 'Real', 'Atingimento %', 'Bateu', 'Situação', 'Justificativa', 'Validado por', 'Validado em', 'A pagar (R$)'].map(c).join(';')];
  L.forEach(x => linhas.push([D.empresa.nome, D.area.nome, D.area.responsavel, MESES[m] + '/' + D.ano, x.l.nome, x.l.cargo, x.i.nome].map(c).concat([n(metaM(x.i, m)), n(realM(x.i, m)), n(x.p.a === null ? '' : Math.round(x.p.a * 10) / 10)]).concat([c(x.p.b ? 'Sim' : 'Não'), c(st[x.p.est]), c(x.p.v ? x.p.v.just : ''), c(x.p.v ? x.p.v.por : ''), c(x.p.v ? dataBr(x.p.v.em) : ''), n(x.p.aPagar)]).join(';')));
  linhas.push(['', '', '', '', '', '', 'TOTAL', '', '', '', '', '', '', '', '', n(L.reduce((s, x) => s + x.p.aPagar, 0))].join(';'));
  const blob = new Blob(['﻿' + linhas.join('\r\n')], { type: 'text/csv;charset=utf-8' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `pagamento-metas-${String(D.area.nome).toLowerCase().replace(/[^a-z0-9]+/gi, '-')}-${MESES[m].toLowerCase()}-${D.ano}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
// ---------- PESSOA (só visualização, atualiza sozinho) ----------
function desenharPessoa() {
  const l = D.lider;
  topo(`${esc(String(l.nome).split(' ')[0])}, suas Metas Individuais 🎯`, `${esc([l.cargo, D.area && D.area.nome].filter(Boolean).join(' · '))}${D.area && D.area.responsavel ? ' · Liderança: ' + esc(D.area.responsavel) : ''}`, `<span class="ao-vivo"><i></i>ao vivo · atualizado às ${new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</span>`);
  APP.innerHTML = `${sonhoHtml()}<div class="card"><div class="barra" style="justify-content:space-between;"><div class="hero-p">${av(l, true)}<div><h2>${esc(l.nome)}</h2><div class="muted">${D.ano}</div></div></div>${selMes('desenharPessoa()')}</div></div>
    ${painelHtml(l, false)}
    ${(D.acoes || []).length ? `<div class="card"><h2>📋 Plano de ação</h2><div class="acs">${D.acoes.map(a => `<div>${{ aberta: '⏳', andamento: '🔄', concluida: '✅', cancelada: '🚫' }[a.status] || '⏳'} ${esc(a.o_que)}<br><small>👤 ${esc(a.quem || '—')} · 📅 ${dataBr(a.quando)}</small></div>`).join('')}</div></div>` : ''}
    <p class="muted" style="text-align:center;">Esta página atualiza sozinha. Impulsionar V4</p>`;
}
carregar();
if (TIPO === 'p') setInterval(() => carregar(true), 30000);
</script>
