<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Ronda de Manutenção</title>
<style>
  :root { --verde:#0f766e; --borda:#e2e8f0; --texto:#0f172a; --sub:#64748b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#f1f5f9; color:var(--texto); }
  header { position:sticky; top:0; z-index:5; background:var(--verde); color:#fff; padding:12px 16px; box-shadow:0 2px 8px rgba(0,0,0,.15); }
  header h1 { font-size:17px; margin:0; } header div { font-size:12.5px; opacity:.9; margin-top:2px; }
  .barra { height:6px; background:rgba(255,255,255,.25); border-radius:3px; margin-top:8px; overflow:hidden; } .barra i { display:block; height:100%; background:#facc15; width:0; transition:width .3s; }
  main { padding:12px 16px 80px; max-width:720px; margin:0 auto; }
  .autor { background:#fff; border:1px solid var(--borda); border-radius:12px; padding:10px 12px; margin-bottom:12px; }
  .autor label { font-size:12px; font-weight:700; color:var(--sub); } .autor input { width:100%; font-size:16px; padding:8px; border:1px solid var(--borda); border-radius:8px; margin-top:4px; }
  .filtros { display:flex; gap:6px; margin-bottom:10px; overflow-x:auto; }
  .filtros button { flex-shrink:0; border:1px solid var(--borda); background:#fff; border-radius:999px; padding:6px 12px; font-size:13px; }
  .filtros button.ativo { background:var(--verde); color:#fff; border-color:var(--verde); }
  h2 { font-size:15px; margin:18px 0 6px; color:var(--verde); }
  h3 { font-size:13.5px; margin:12px 0 6px; color:#334155; }
  .item { background:#fff; border:1px solid var(--borda); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
  .item.feito { border-color:#86efac; background:#f0fdf4; }
  .item .txt { font-size:14px; line-height:1.35; } .item .num { font-weight:800; }
  .tag { display:inline-block; font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:999px; margin-left:4px; vertical-align:middle; }
  .critico { background:#fee2e2; color:#991b1b; } .pede { background:#e0f2fe; color:#075985; } .nota { background:#f1f5f9; color:#334155; }
  details { margin-top:4px; } summary { font-size:12px; color:#4338ca; cursor:pointer; } details div { font-size:12px; color:#475569; white-space:pre-line; margin-top:4px; }
  .acoes { display:flex; gap:8px; margin-top:8px; align-items:center; }
  .obs { flex:1; font-size:14px; padding:8px; border:1px solid var(--borda); border-radius:8px; min-width:0; }
  .foto-btn { flex-shrink:0; background:var(--verde); color:#fff; border:0; border-radius:10px; padding:10px 14px; font-size:14px; font-weight:700; }
  .foto-btn input { display:none; }
  .miniaturas { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; } .miniaturas img { width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--borda); }
  .ideal { font-size:12px; margin-top:4px; } .ideal a { color:#2563eb; }
  .envio { font-size:12px; margin-top:6px; } .envio.erro { color:#dc2626; } .envio.ok { color:#166534; }
  .vazio { text-align:center; color:var(--sub); padding:40px 10px; }
  .toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#0f172a; color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; display:none; z-index:10; }
</style>
</head>
<body>
<header><h1>📷 Ronda de Manutenção</h1><div id="sub">Carregando...</div><div class="barra"><i id="prog"></i></div></header>
<main id="main"><div class="vazio">Carregando checklist...</div></main>
<div class="toast" id="toast"></div>
<script>
const TOKEN = new URLSearchParams(location.search).get('t') || '';
let R = null, FILTRO = 'todos';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 2500); }
function fotosDo(id) { return R.fotos.filter(f => f.item === id); }
function itens() { return R.secoes.flatMap(s => s.grupos.flatMap(g => g.itens)); }
function progresso() {
  const l = itens(), feitos = l.filter(i => fotosDo(i.id).length).length;
  document.getElementById('prog').style.width = (l.length ? feitos / l.length * 100 : 0) + '%';
  document.getElementById('sub').textContent = `${R.empresa} · T${R.trimestre}/${R.ano} · ${feitos}/${l.length} itens com foto`;
}
function visivel(i) {
  if (FILTRO === 'pede') return i.foto;
  if (FILTRO === 'critico') return i.critico;
  if (FILTRO === 'pendente') return !fotosDo(i.id).length;
  if (FILTRO === 'nok') return i.nota !== '' && i.nota !== 'na' && Number(i.nota) < 3;
  return true;
}
function render() {
  const main = document.getElementById('main');
  const f = (k, r) => `<button class="${FILTRO === k ? 'ativo' : ''}" onclick="FILTRO='${k}'; render();">${r}</button>`;
  let html = `<div class="autor"><label>Quem está fazendo a ronda</label><input id="autor" value="${esc(localGet('ronda_autor'))}" placeholder="Seu nome" onchange="localSet('ronda_autor', this.value)"></div>
    <div class="filtros">${f('todos', 'Todos')}${f('pendente', 'Sem foto')}${f('pede', '📷 Pede foto')}${f('critico', '🔴 Críticos')}${f('nok', 'Nota &lt; 3')}</div>`;
  let algum = false;
  R.secoes.forEach(s => {
    const gs = s.grupos.map(g => ({ g, l: g.itens.filter(visivel) })).filter(x => x.l.length);
    if (!gs.length) return;
    html += `<h2>${esc(s.titulo)}</h2>`;
    gs.forEach(({ g, l }) => {
      html += `<h3>${esc(g.numero)} · ${esc(g.titulo)}</h3>`;
      l.forEach(i => {
        algum = true;
        const fs = fotosDo(i.id);
        html += `<div class="item ${fs.length ? 'feito' : ''}" id="it-${i.id}">
          <div class="txt"><span class="num">${esc(i.num)}</span> ${esc(i.texto)}${i.critico ? '<span class="tag critico">crítico</span>' : ''}${i.foto ? '<span class="tag pede">pede foto</span>' : ''}${i.nota !== '' ? `<span class="tag nota">nota ${i.nota === 'na' ? 'N/A' : esc(i.nota)}</span>` : ''}</div>
          ${i.verificacao ? `<details><summary>O que verificar</summary><div>${esc(i.verificacao)}</div></details>` : ''}
          ${i.fotoIdeal ? `<div class="ideal">📌 <a href="${esc(i.fotoIdeal)}" target="_blank">Ver foto da condição ideal</a></div>` : ''}
          <div class="acoes"><input class="obs" id="obs-${i.id}" placeholder="Observação (opcional)">
            <label class="foto-btn">📷 Foto<input type="file" accept="image/*" capture="environment" onchange="enviar('${i.id}', this)"></label></div>
          <div class="envio" id="env-${i.id}"></div>
          ${fs.length ? `<div class="miniaturas">${fs.map(x => `<a href="${esc(x.url)}" target="_blank"><img src="${esc(x.url)}" alt="" loading="lazy"></a>`).join('')}</div>` : ''}
        </div>`;
      });
    });
  });
  if (!algum) html += '<div class="vazio">Nenhum item neste filtro.</div>';
  main.innerHTML = html;
  progresso();
}
function localGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function localSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
async function reduzir(arq) {
  // reduz fotos grandes do celular antes de subir (máx. 1600px, JPEG 0,8)
  try {
    if (!/^image\/(jpe?g|png|webp)$/i.test(arq.type) || arq.size < 900000) return arq;
    const img = await new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = erro; i.src = URL.createObjectURL(arq); });
    const k = Math.min(1, 1600 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.8));
    return blob ? new File([blob], (arq.name || 'foto').replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : arq;
  } catch (e) { return arq; }
}
async function enviar(id, input) {
  const arq = input.files && input.files[0]; if (!arq) return;
  const st = document.getElementById('env-' + id);
  st.className = 'envio'; st.textContent = '⏫ Enviando foto...';
  try {
    const fd = new FormData();
    fd.append('file', await reduzir(arq));
    fd.append('item', id);
    fd.append('obs', (document.getElementById('obs-' + id) || {}).value || '');
    fd.append('autor', (document.getElementById('autor') || {}).value || '');
    const r = await fetch('/api/public/ronda/' + encodeURIComponent(TOKEN) + '/foto', { method: 'POST', body: fd });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Falha no envio.');
    R.fotos.unshift({ item: id, url: j.url, obs: fd.get('obs'), autor: fd.get('autor'), created_at: new Date().toISOString() });
    render();
    const el = document.getElementById('env-' + id); if (el) { el.className = 'envio ok'; el.textContent = '✅ Foto enviada para o sistema.'; }
    toast('✅ Foto enviada!');
  } catch (e) { st.className = 'envio erro'; st.textContent = '⚠️ ' + e.message + ' Tente de novo.'; }
  input.value = '';
}
(async () => {
  try {
    if (!TOKEN) throw new Error('Link sem código da ronda.');
    const r = await fetch('/api/public/ronda/' + encodeURIComponent(TOKEN));
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Não foi possível abrir a ronda.');
    R = j; R.fotos = R.fotos || [];
    document.title = `Ronda T${R.trimestre}/${R.ano} — ${R.empresa}`;
    render();
  } catch (e) {
    document.getElementById('sub').textContent = 'Erro';
    document.getElementById('main').innerHTML = `<div class="vazio">⚠️ ${esc(e.message)}</div>`;
  }
})();
</script>
</body>
</html>
