<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Apresentação · Quem Move Pessoas, Move Resultados</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --navy:#0f172a; --navy2:#172554; --ambar:#f59e0b; --creme:#f8f5ee; }
  * { box-sizing:border-box; } html, body { margin:0; height:100%; background:#000; font-family:'Montserrat', system-ui, sans-serif; overflow:hidden; color:#fff; }
  .palco { position:fixed; inset:0; display:grid; place-items:center; }
  .slide { position:absolute; width:min(100vw, 177.78vh); height:min(56.25vw, 100vh); background:radial-gradient(900px 500px at 85% -10%, rgba(245,158,11,.22), transparent 60%), linear-gradient(160deg, var(--navy), var(--navy2)); display:flex; flex-direction:column; justify-content:center; padding:6% 8%; opacity:0; transform:scale(.98); transition:opacity .45s, transform .45s; pointer-events:none; font-size:min(1.6vw, 2.85vh); }
  .slide.on { opacity:1; transform:none; pointer-events:auto; }
  .slide.claro { background:var(--creme); color:var(--navy); }
  .k { color:var(--ambar); font-weight:800; letter-spacing:.2em; text-transform:uppercase; font-size:1em; margin-bottom:1em; }
  h1 { font-size:4.2em; line-height:1.02; margin:0; font-weight:900; letter-spacing:-.02em; } h1 em { font-style:normal; color:var(--ambar); }
  h2 { font-size:3em; line-height:1.08; margin:0 0 .5em; font-weight:900; }
  .gig { font-size:12em; font-weight:900; line-height:.9; color:var(--ambar); letter-spacing:-.04em; }
  .sub { font-size:1.6em; color:#cbd5e1; margin-top:.8em; max-width:80%; } .claro .sub { color:#475569; }
  .frase { font-size:3.3em; font-weight:900; line-height:1.12; max-width:90%; } .frase::before { content:'“'; color:var(--ambar); }  .frase::after { content:'”'; color:var(--ambar); }
  .tempo { display:grid; grid-template-columns:repeat(6, 1fr); gap:1em; margin-top:1.4em; }
  .tempo div { border-top:.3em solid var(--ambar); padding-top:.8em; } .tempo b { display:block; color:var(--ambar); font-size:1em; } .tempo span { font-size:1.15em; font-weight:700; }
  .mover { display:grid; grid-template-columns:repeat(5, 1fr); gap:1.2em; margin-top:1.4em; }
  .mover div { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:1em; padding:1.3em; }
  .mover i { font-style:normal; display:grid; place-items:center; width:2.2em; height:2.2em; border-radius:.5em; background:var(--ambar); color:var(--navy); font-weight:900; font-size:2em; margin-bottom:.5em; }
  .mover b { font-size:1.2em; }
  .cron { font-size:7em; font-weight:900; color:var(--ambar); font-variant-numeric:tabular-nums; margin-top:.2em; }
  .rod { position:absolute; left:8%; right:8%; bottom:4%; display:flex; justify-content:space-between; font-size:.9em; color:#94a3b8; } .claro .rod { color:#64748b; }
  .prog { position:fixed; left:0; top:0; height:4px; background:var(--ambar); transition:width .3s; z-index:5; }
  .notas { position:fixed; left:0; right:0; bottom:0; z-index:6; background:rgba(2,6,23,.94); border-top:2px solid var(--ambar); padding:16px 22px 18px; font-size:17px; line-height:1.45; color:#e2e8f0; max-height:42vh; overflow:auto; display:none; }
  .notas.on { display:block; } .notas b { color:var(--ambar); }
  .ctl { position:fixed; right:14px; top:12px; z-index:7; display:flex; gap:8px; opacity:.25; transition:opacity .2s; } .ctl:hover { opacity:1; }
  .ctl button { font:inherit; font-size:13px; font-weight:700; border:none; border-radius:999px; padding:8px 12px; background:rgba(255,255,255,.12); color:#fff; cursor:pointer; }
  .relogio { position:fixed; left:14px; top:12px; z-index:7; font-size:13px; font-weight:700; color:#94a3b8; font-variant-numeric:tabular-nums; }
  .slide { padding-top:9%; }
  .logo { position:absolute; left:8%; top:4.5%; display:flex; align-items:center; gap:.6em; z-index:2; }
  .logo .v4 { position:relative; width:2.6em; height:2.6em; border-radius:.7em; display:grid; place-items:center; background:linear-gradient(145deg,#0b1329,#13284a); box-shadow:0 0 0 .14em #22c55e, 0 .4em 1.4em rgba(34,197,94,.35); }
  .logo .v4 b { color:#fff; font-weight:900; font-size:1.15em; letter-spacing:-.05em; } .logo .v4 i { position:absolute; top:.08em; right:.22em; font-style:normal; color:#4ade80; font-weight:900; font-size:.8em; }
  .logo span { font-weight:900; letter-spacing:.22em; font-size:.95em; line-height:1.15; } .logo small { display:block; font-weight:700; letter-spacing:.24em; font-size:.62em; color:#4ade80; }
  .claro .logo span { color:var(--navy); } .claro .logo small { color:#16a34a; }
  .qrs { display:flex; gap:2.4em; margin-top:.4em; } .qrs div { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15); border-radius:1.2em; padding:1.2em 1.6em; text-align:center; }
  .qrs img { width:8em; height:8em; background:#fff; border-radius:.6em; padding:.4em; display:block; margin:0 auto .7em; } .qrs b { display:block; font-size:1.45em; } .qrs small { color:#94a3b8; font-size:1em; }
</style>
</head>
<body>
<div class="prog" id="prog"></div>
<div class="relogio" id="relogio">00:00</div>
<div class="ctl"><button onclick="ir(-1)">←</button><button onclick="ir(1)">→</button><button onclick="alternarNotas()">📝 Notas (N)</button><button onclick="telaCheia()">⛶ Tela cheia (F)</button></div>
<div class="palco" id="palco"></div>
<div class="notas" id="notas"></div>
<script>
const AP = { i: 0, slides: [], inicio: null, cron: null };
const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
(async () => {
  let d; try { d = await (await fetch('/api/public/mentoria/palestra-completa', { cache: 'no-store' })).json(); } catch (e) { document.body.innerHTML = '<p style="padding:40px">Não consegui carregar a apresentação.</p>'; return; }
  const p = d.palestra, m = d.marca, r = p.roteiro, bloco = i => r[i] || {}, f = p.frases || [];
  const igE = String(m.instagramEmpresa || 'impulsionarv4').replace(/^@/, ''), igL = String(m.instagram || 'lazaroneto.oficial').replace(/^@/, ''), emp = m.empresa || 'Impulsionar V4';
  const logo = `<div class="logo"><div class="v4"><b>V4</b><i>↗</i></div><span>IMPULSIONAR<small>GESTÃO &amp; PESSOAS</small></span></div>`;
  const rod = `${logo}<div class="rod"><span>${esc(m.mentor)} · Consultor ${esc(emp)}</span><span>@${esc(igE)} · @${esc(igL)}</span></div>`;
  const qr = u => `https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=8&data=${encodeURIComponent(u)}`;
  AP.slides = [
    { html: `${m.fotoUrl ? `<img src="${esc(m.fotoUrl)}" alt="" style="position:absolute;right:0;bottom:0;height:100%;width:42%;object-fit:cover;object-position:top;-webkit-mask-image:linear-gradient(90deg,transparent,#000 35%);mask-image:linear-gradient(90deg,transparent,#000 35%);">` : ''}<div style="position:relative;max-width:62%"><div class="k">Palestra</div><h1>${esc(p.titulo).replace(/,\s*/, ',<br>').replace(/(Move Resultados)/i, '<em>$1</em>')}</h1><div class="sub">${esc(m.mentor)} · do chão à gestão</div></div>${rod}`, notas: 'Entre sem falar por 3 segundos. Olhe a plateia. Avance para "2013" e comece a abertura.' },
    { html: `<div class="gig">2013</div><div class="sub">Ajudante de distribuição. Antes do sol nascer.</div>${rod}`, notas: `<b>${esc(bloco(0).tempo)} · ${esc(bloco(0).bloco)}</b><br>${esc(p.abertura)}` },
    { html: `<div class="k">A virada</div><h2>Quem foi esse líder na sua vida?</h2><div class="sub">Aquele que te enxergou, te treinou e te cobrou.</div>${rod}`, notas: `<b>${esc(bloco(1).tempo)} · ${esc(bloco(1).bloco)}</b><br>${esc(bloco(1).acontece)} Peça para 2 ou 3 pessoas responderem em voz alta.` },
    { html: `<div class="k">Do chão à gestão</div><h2>Cada degrau me ensinou algo sobre gente</h2><div class="tempo">${(d.historia || []).map(h => `<div><b>${esc(h.fase)}</b><span>${esc(h.cargo)}</span></div>`).join('')}</div>${rod}`, notas: 'Conte em 1 frase o aprendizado de cada degrau. Não leia o slide.' },
    { html: `<div class="k">O método</div><h2>MOVER</h2><div class="mover">${(d.metodo || []).map(x => `<div><i>${esc(x.letra)}</i><b>${esc(x.nome)}</b></div>`).join('')}</div>${rod}`, notas: 'Apresente os 5 pilares como a "ordem do crescimento de um líder": postura, controle, time, rotina, sucessores.' },
    { html: `<div class="k">M · ${esc(bloco(2).bloco)}</div><div class="frase">Do "faço minha parte" para o "faço acontecer".</div>${rod}`, notas: `<b>${esc(bloco(2).tempo)}</b><br>${esc(bloco(2).acontece)}` },
    { html: `<div class="k">O · ${esc(bloco(3).bloco)}</div><div class="frase">${esc(f[2] || 'Quem não mede, discute. Quem mede, decide.')}</div><div class="sub">250 pessoas · 47 caminhões · 14 carretas</div>${rod}`, notas: `<b>${esc(bloco(3).tempo)}</b><br>${esc(bloco(3).acontece)}` },
    { html: `<div class="k">V · ${esc(bloco(4).bloco)}</div><div class="frase">${esc(f[1] || 'Time não abandona empresa. Time abandona líder.')}</div>${rod}`, notas: `<b>${esc(bloco(4).tempo)}</b><br>${esc(bloco(4).acontece)}` },
    { html: `<div class="k">Dinâmica em dupla · 3 minutos</div><h2>Conte para quem está ao seu lado: qual foi o reconhecimento que mais te marcou?</h2><div class="cron" data-seg="180">03:00</div>${rod}`, notas: 'Toque em T (ou clique no número) para iniciar o cronômetro de 3 minutos. Depois peça 2 exemplos para a plateia.', cron: 180 },
    { html: `<div class="k">E + R · ${esc(bloco(5).bloco)}</div><div class="frase">${esc(f[3] || 'O melhor líder é aquele que, quando sai de férias, a operação continua rodando.')}</div>${rod}`, notas: `<b>${esc(bloco(5).tempo)}</b><br>${esc(bloco(5).acontece)}` },
    { html: `<div class="k">${esc(bloco(6).bloco || 'Compromisso')}</div><h2>Escreva 1 atitude que você vai mudar na segunda-feira.</h2><div class="cron" data-seg="300">05:00</div>${rod}`, notas: `<b>${esc(bloco(6).tempo)}</b><br>${esc(bloco(6).acontece)} Inicie o cronômetro com T.`, cron: 300 },
    { html: `<div class="frase">${esc(f[0] || 'Liderança não é cargo. É quantas pessoas você fez crescer.')}</div>${rod}`, notas: 'Pausa de 3 segundos depois de ler a frase.' },
    { html: `<div class="k">${esc(bloco(7).bloco || 'Fechamento')}</div><h1>Quem move pessoas,<br><em>move resultados.</em></h1><div class="sub">Mentoria ${esc(m.nome)} · palestras e treinamento in-company<br><b style="color:#fff">${esc(location.host)}/mentoria</b> · ${esc(location.host)}/palestra</div>${rod}`, notas: `<b>${esc(bloco(7).tempo)}</b><br>${esc(p.fechamento)}<br><br>Convide para a mentoria e ofereça o treinamento in-company para o RH.` },
    { html: `<div class="k">Obrigado! Vamos continuar juntos</div><h2>Aponte a câmera do celular e siga</h2><div class="qrs"><div><img src="${qr('https://instagram.com/' + igE)}" alt=""><b>@${esc(igE)}</b><small>${esc(emp)} · gestão e pessoas</small></div><div><img src="${qr('https://instagram.com/' + igL)}" alt=""><b>@${esc(igL)}</b><small>${esc(m.mentor)} · consultor</small></div></div><div class="sub" style="font-size:1.25em;margin-top:1.2em;">🌐 impulsionarv4.com.br${m.whatsapp ? ' · 💬 ' + esc(m.whatsapp) : ''}</div>${rod}`, notas: 'Deixe este slide na tela enquanto as pessoas saem: peça para todos apontarem a câmera e seguirem. Agradeça a empresa e o RH pelo nome.' }
  ];
  document.getElementById('palco').innerHTML = AP.slides.map((s, i) => `<section class="slide" data-i="${i}">${s.html}</section>`).join('');
  document.querySelectorAll('.cron').forEach(c => c.onclick = () => cronometro(c));
  const h = Number(location.hash.replace('#', '')); mostrar(Number.isFinite(h) && h > 0 ? h - 1 : 0);
  setInterval(() => { if (!AP.inicio) return; const s = Math.floor((Date.now() - AP.inicio) / 1000); document.getElementById('relogio').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }, 500);
})();
function mostrar(i) {
  AP.i = Math.max(0, Math.min(AP.slides.length - 1, i)); if (AP.i > 0 && !AP.inicio) AP.inicio = Date.now();
  document.querySelectorAll('.slide').forEach((s, k) => s.classList.toggle('on', k === AP.i));
  document.getElementById('prog').style.width = ((AP.i + 1) / AP.slides.length * 100) + '%';
  document.getElementById('notas').innerHTML = `<b>Slide ${AP.i + 1} de ${AP.slides.length}</b> · ${AP.slides[AP.i].notas || ''}`;
  history.replaceState(null, '', '#' + (AP.i + 1));
}
function ir(n) { mostrar(AP.i + n); }
function alternarNotas() { document.getElementById('notas').classList.toggle('on'); }
function telaCheia() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); }
function cronometro(el) {
  el = el || document.querySelector('.slide.on .cron'); if (!el) return;
  clearInterval(AP.cron); let s = Number(el.dataset.seg) || 180; const fim = Date.now() + s * 1000;
  AP.cron = setInterval(() => { const r = Math.max(0, Math.round((fim - Date.now()) / 1000)); el.textContent = String(Math.floor(r / 60)).padStart(2, '0') + ':' + String(r % 60).padStart(2, '0'); if (!r) { clearInterval(AP.cron); el.textContent = 'Tempo!'; } }, 250);
}
document.addEventListener('keydown', e => {
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); ir(1); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); ir(-1); }
  else if (e.key.toLowerCase() === 'n') alternarNotas(); else if (e.key.toLowerCase() === 'f') telaCheia(); else if (e.key.toLowerCase() === 't') cronometro();
  else if (e.key === 'Home') mostrar(0); else if (e.key === 'End') mostrar(AP.slides.length - 1);
});
let toqueX = null;
document.addEventListener('touchstart', e => { toqueX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => { if (toqueX === null) return; const dx = e.changedTouches[0].clientX - toqueX; if (Math.abs(dx) > 50) ir(dx < 0 ? 1 : -1); toqueX = null; });
</script>
</body>
</html>
