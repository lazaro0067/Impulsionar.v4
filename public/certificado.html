<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificado · Impulsionar V4</title>
<meta name="theme-color" content="#0f2747">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  @font-face { font-family:'Inter'; src:url('/fonts/Inter-Medium.woff') format('woff'); font-weight:400 500; }
  @font-face { font-family:'Inter'; src:url('/fonts/Inter-Bold.woff') format('woff'); font-weight:600 700; }
  @font-face { font-family:'Inter'; src:url('/fonts/Inter-ExtraBold.woff') format('woff'); font-weight:800; }
  @font-face { font-family:'Inter'; src:url('/fonts/Inter-Black.woff') format('woff'); font-weight:900; }
  :root { --navy:#13294b; --navy2:#0b1a33; --verde:#0f9d6e; --verde2:#22c55e; --ouro:#b08d3c; --tinta:#1f2a3d; --cinza:#5b6577; }
  * { box-sizing:border-box; }
  body { margin:0; background:#e8ecf2; font-family:'Inter',system-ui,sans-serif; color:var(--tinta); -webkit-font-smoothing:antialiased; }
  .barra { max-width:1123px; margin:18px auto 12px; padding:0 12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .valido { flex:1; min-width:240px; display:flex; gap:10px; align-items:center; background:#fff; border:1px solid #cfe9dd; border-left:5px solid var(--verde); border-radius:12px; padding:10px 14px; font-size:14px; }
  .valido.ruim { border-color:#fecaca; border-left-color:#dc2626; } .valido.previa { border-color:#fde68a; border-left-color:#d97706; }
  .valido b { display:block; } .valido small { color:var(--cinza); }
  .bt { border:none; border-radius:10px; padding:10px 14px; font:inherit; font-weight:700; font-size:14px; cursor:pointer; text-decoration:none; display:inline-flex; gap:6px; align-items:center; background:#fff; color:var(--navy); border:1px solid #cbd5e1; }
  .bt.pri { background:var(--navy); color:#fff; border-color:var(--navy); } .bt.li { background:#0a66c2; color:#fff; border-color:#0a66c2; }
  .palco { overflow:auto; padding:0 12px 30px; }
  /* A4 paisagem: 297 × 210 mm */
  .cert { position:relative; width:1123px; height:794px; margin:0 auto; background:#fff; overflow:hidden; box-shadow:0 20px 60px rgba(15,23,42,.22); transform-origin:top left; }
  .cert .fx { position:absolute; inset:0; pointer-events:none; }
  .moldura { position:absolute; inset:22px; border:2px solid var(--navy); }
  .moldura::after { content:''; position:absolute; inset:7px; border:1px solid var(--verde); }
  .canto { position:absolute; width:300px; height:300px; }
  .marcadagua { position:absolute; right:-60px; bottom:-120px; font:900 520px/1 'Inter',sans-serif; color:var(--navy); opacity:.035; letter-spacing:-30px; }
  .conteudo { position:absolute; inset:58px 86px 50px; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .logo { height:96px; mix-blend-mode:multiply; margin-top:-6px; filter:contrast(1.06) brightness(1.04); }
  .rotulo { margin-top:8px; font:800 13px/1 'Inter'; letter-spacing:6px; color:var(--verde); }
  h1 { margin:8px 0 0; font:700 64px/1 'Cormorant Garamond',Georgia,serif; color:var(--navy); letter-spacing:3px; }
  .sub { margin-top:6px; font:700 14px/1 'Inter'; letter-spacing:5px; color:var(--ouro); }
  .certificamos { margin-top:24px; font-size:16px; color:var(--cinza); }
  .nome { margin-top:4px; font:700 56px/1.05 'Cormorant Garamond',Georgia,serif; color:var(--navy2); padding:0 30px 10px; border-bottom:1.5px solid var(--ouro); min-width:520px; }
  .texto { margin-top:16px; max-width:820px; font-size:16.5px; line-height:1.62; color:var(--tinta); }
  .texto b { color:var(--navy); }
  .conteudos { margin-top:14px; display:flex; flex-wrap:wrap; justify-content:center; gap:6px 8px; max-width:900px; }
  .conteudos span { font-size:11.5px; font-weight:700; color:var(--navy); background:#eef4f1; border:1px solid #cfe6db; border-radius:999px; padding:4px 11px; }
  .rodape { position:absolute; left:0; right:0; bottom:0; display:grid; grid-template-columns:1fr 170px 1fr; align-items:end; gap:20px; }
  .ass { text-align:center; } .ass .sig { font:400 44px/1 'Great Vibes',cursive; color:var(--navy); height:48px; } .ass .linha { border-top:1.2px solid var(--tinta); margin:4px 30px 6px; }
  .ass b { display:block; font-size:14px; color:var(--navy); } .ass small { font-size:11.5px; color:var(--cinza); }
  .selo { display:flex; justify-content:center; margin-bottom:-6px; }
  .valida { display:flex; gap:12px; align-items:flex-end; justify-content:flex-end; text-align:right; padding-right:84px; margin-bottom:6px; }
  .valida .dt { font-size:12.5px; color:var(--tinta); font-weight:600; white-space:nowrap; } .valida small { display:block; font-size:10.5px; color:var(--cinza); margin-top:4px; } .valida code { font-family:'Inter'; font-weight:800; color:var(--navy); letter-spacing:.5px; }
  .valida img { width:76px; height:76px; border:1px solid #e2e8f0; padding:3px; background:#fff; }
  .tarja { position:absolute; top:150px; left:-80px; transform:rotate(-30deg); background:#d97706; color:#fff; font:900 18px/1 'Inter'; letter-spacing:4px; padding:10px 120px; opacity:.9; z-index:5; }
  .erro { max-width:600px; margin:60px auto; background:#fff; border-radius:16px; padding:28px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.08); }
  @media print {
    @page { size:A4 landscape; margin:0; }
    body { background:#fff; } .barra { display:none !important; } .palco { padding:0; overflow:visible; }
    .cert { box-shadow:none; margin:0; transform:none !important; width:297mm; height:210mm; }
    html, body { width:297mm; height:210mm; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>
<body>
<div class="barra" id="barra"></div>
<div class="palco" id="palco"><div class="erro">Carregando o certificado…</div></div>
<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const dataLonga = v => { if (!v) return ''; const [a, m, d] = String(v).slice(0, 10).split('-').map(Number); return `${d} de ${MESES[m - 1]} de ${a}`; };
const dataCurta = v => v ? String(v).slice(0, 10).split('-').reverse().join('/') : '';
const horas = h => (Number(h) % 1 ? String(h).replace('.', ',') : String(Number(h))) + (Number(h) === 1 ? ' hora' : ' horas');
const selo = `<svg width="150" height="150" viewBox="0 0 150 150" aria-hidden="true"><defs><path id="ar" d="M75,75 m-56,0 a56,56 0 1,1 112,0 a56,56 0 1,1 -112,0"/><linearGradient id="gs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13294b"/><stop offset="1" stop-color="#0b1a33"/></linearGradient></defs>
  <circle cx="75" cy="75" r="72" fill="#b08d3c"/><circle cx="75" cy="75" r="67" fill="url(#gs)"/><circle cx="75" cy="75" r="44" fill="none" stroke="#b08d3c" stroke-width="1.5"/>
  <text font-family="Inter" font-weight="800" font-size="10.5" letter-spacing="2.6" fill="#e9d9a8"><textPath href="#ar" startOffset="2%">MENTORIA CONCLUÍDA · IMPULSIONAR V4 ·</textPath></text>
  <text x="75" y="84" text-anchor="middle" font-family="Inter" font-weight="900" font-size="30" fill="#fff">V4</text><path d="M95 58 l9 -9 m0 0 h-7 m7 0 v7" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="75" y="102" text-anchor="middle" font-family="Inter" font-weight="800" font-size="8" letter-spacing="1.5" fill="#22c55e">CERTIFICADO</text></svg>`;
const canto = (t) => `<svg class="canto" style="${t}" viewBox="0 0 300 300"><path d="M0 0 H300 L0 300 Z" fill="#13294b" opacity=".96"/><path d="M0 0 H215 L0 215 Z" fill="#0f9d6e" opacity=".9"/><path d="M0 0 H140 L0 140 Z" fill="#0b1a33"/><path d="M38 96 L96 38" stroke="#b08d3c" stroke-width="3"/></svg>`;
function render(c) {
  const x = c.dados || {}, url = location.origin + '/certificado/' + c.codigo, previa = !!c.previa;
  const periodo = x.inicio && x.fim && x.inicio !== x.fim ? `de <b>${dataCurta(x.inicio)}</b> a <b>${dataCurta(x.fim)}</b>` : x.inicio ? `em <b>${dataCurta(x.inicio)}</b>` : '';
  document.title = `Certificado · ${x.nome} · ${x.programa}`;
  const emit = String(c.emitido_em || '').slice(0, 10);
  const li = 'https://www.linkedin.com/profile/add?' + new URLSearchParams({ startTask: 'CERTIFICATION_NAME', name: 'Mentoria ' + x.programa, organizationName: x.empresaEmissora || 'Impulsionar V4', issueYear: emit.slice(0, 4), issueMonth: String(Number(emit.slice(5, 7)) || ''), certUrl: url, certId: c.codigo }).toString();
  document.getElementById('barra').innerHTML = `<div class="valido ${c.revogado ? 'ruim' : previa ? 'previa' : ''}"><span style="font-size:26px;">${c.revogado ? '⛔' : previa ? '👁️' : '✅'}</span><div><b>${c.revogado ? 'Certificado cancelado' : previa ? 'Prévia do certificado — ainda não emitido' : 'Certificado válido'}</b><small>${previa ? 'É assim que o aluno vai ver depois da emissão.' : `${esc(x.nome)} · ${esc(x.programa)} · emitido em ${dataCurta(emit)} · código ${esc(c.codigo)}`}</small></div></div>
    <button class="bt pri" onclick="window.print()">⬇️ Baixar PDF / imprimir</button>${previa || c.revogado ? '' : `<a class="bt li" href="${li}" target="_blank" rel="noopener">in Adicionar ao LinkedIn</a><button class="bt" onclick="copiar('${url}')">🔗 Copiar link</button>`}`;
  document.getElementById('palco').innerHTML = `<div class="cert" id="cert">
    ${previa ? '<div class="tarja">PRÉVIA</div>' : ''}
    <div class="fx">${canto('left:0;top:0;')}${canto('right:0;bottom:0;width:190px;height:190px;transform:rotate(180deg);')}<div class="marcadagua">V4</div><div class="moldura"></div></div>
    <div class="conteudo">
      <img class="logo" src="/assets/logo-impulsionar.jpg" alt="Impulsionar V4">
      <div class="rotulo">GESTÃO &amp; DESENVOLVIMENTO DE PESSOAS</div>
      <h1>CERTIFICADO</h1><div class="sub">DE CONCLUSÃO DE MENTORIA</div>
      <div class="certificamos">Certificamos que</div>
      <div class="nome">${esc(x.nome)}</div>
      <div class="texto">concluiu a mentoria <b>${esc(x.programa)}</b>, promovida pela <b>${esc(x.empresaEmissora || 'Impulsionar V4')}</b>, com carga horária de <b>${horas(x.cargaHoraria)}</b>, realizada ${periodo}${x.encontros ? ` em <b>${x.encontros} encontros</b>` : ''}${x.presencaPct ? `, com <b>${x.presencaPct}% de presença</b>` : ''}.</div>
      ${(x.conteudo || []).length ? `<div class="conteudos">${x.conteudo.map(t => `<span>${esc(t)}</span>`).join('')}</div>` : ''}
      <div class="rodape">
        <div class="ass"><div class="sig">${esc(x.mentor)}</div><div class="linha"></div><b>${esc(x.mentor)}</b><small>${esc(x.mentorCargo || 'Mentor · Impulsionar V4')}</small></div>
        <div class="selo">${selo}</div>
        <div class="valida"><div><div class="dt">${esc(x.cidade || '')}${x.cidade ? ', ' : ''}${dataLonga(emit)}</div><small>Código de validação<br><code>${esc(c.codigo)}</code></small><small>Valide em ${esc(location.host)}/certificado</small></div>${previa ? '' : `<img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&margin=0&data=${encodeURIComponent(url)}" alt="QR de validação">`}</div>
      </div>
    </div></div>`;
  ajustar();
}
function ajustar() { const c = document.getElementById('cert'); if (!c) return; const w = Math.min(1, (innerWidth - 24) / 1123); c.style.transform = w < 1 ? `scale(${w})` : ''; c.style.marginBottom = w < 1 ? `${-(794 * (1 - w))}px` : ''; c.style.marginLeft = w < 1 ? '0' : 'auto'; }
addEventListener('resize', ajustar);
async function copiar(t) { try { await navigator.clipboard.writeText(t); alert('Link copiado!'); } catch (e) { prompt('Copie o link:', t); } }
function erro(t) { document.getElementById('palco').innerHTML = `<div class="erro"><h2 style="margin-top:0;">🎓 Certificado</h2><p>${esc(t)}</p><form onsubmit="location.href='/certificado/'+encodeURIComponent(this.c.value.trim().toUpperCase()); return false;" style="display:flex;gap:8px;justify-content:center;margin-top:14px;"><input name="c" placeholder="Código: IV4-2026-XXXXXXXX" style="padding:10px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;min-width:240px;"><button class="bt pri">Validar</button></form></div>`; }
(async () => {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('previa')) { try { return render(JSON.parse(decodeURIComponent(escape(atob(h.get('previa')))))); } catch (e) { return erro('Prévia inválida.'); } }
  const cod = decodeURIComponent((location.pathname.match(/\/certificado\/([^/]+)/) || [])[1] || '');
  if (!cod) return erro('Digite o código do certificado para validar.');
  try { const r = await fetch('/api/public/certificado/' + encodeURIComponent(cod)), j = await r.json(); if (!r.ok) return erro(j.error || 'Certificado não encontrado.'); render(j); }
  catch (e) { erro('Sem conexão. Tente de novo.'); }
})();
</script>
</body>
</html>
