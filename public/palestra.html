<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palestra Quem Move Pessoas, Move Resultados · Lázaro Neto</title>
<meta name="description" content="Palestra e treinamento in-company para líderes de operação: motivação, indicadores, rotina e formação de sucessores. Por Lázaro Neto.">
<meta property="og:title" content="Palestra: Quem Move Pessoas, Move Resultados">
<meta property="og:description" content="Para SIPAT, convenções e reuniões de resultado. Leve para os líderes da sua empresa.">
<meta property="og:image" content="https://www.impulsionarv4.com.br/mentoria-foto.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/mentoria-estilo.css?v=1">
<style>
  .probs { border:1.5px solid var(--linha); border-radius:12px; padding:10px 12px 6px; margin:0; min-width:0; } .probs-op { display:flex; flex-wrap:wrap; gap:6px; }
  .probs legend { font-size:13px; font-weight:700; padding:0 6px; } .probs legend small { font-weight:500; color:var(--cinza); }
  .probs label { display:inline-flex !important; width:auto !important; align-items:center; cursor:pointer; margin:0; position:relative; }
  .probs input { position:absolute; opacity:0; width:1px !important; height:1px; }
  .probs span { border:1.5px solid var(--linha); border-radius:99px; padding:6px 11px; font-weight:600; font-size:12.5px; white-space:nowrap; background:#fff; transition:.15s; }
  .probs input:checked + span { background:var(--ambar); border-color:var(--ambar); color:var(--navy); }
  .probs input:focus-visible + span { box-shadow:0 0 0 4px rgba(245,158,11,.25); }
</style>
</head>
<body>
<div id="app"><div class="cx" style="padding:80px 20px;text-align:center;color:#64748b;">Carregando…</div></div>
<script src="/mentoria-comum.js?v=3"></script>
<script>
(async () => {
  let d; try { d = await mtCarregar(); } catch (e) { return mtErroPagina(e); }
  const m = d.marca, p = d.palestra, pal = d.ofertas.find(o => o.codigo === 'palestra') || {}, inc = d.ofertas.find(o => o.codigo === 'incompany') || {};
  document.title = `Palestra ${p.titulo} · ${m.mentor}`;
  document.getElementById('app').innerHTML = `${mtTopo('palestra')}
  <section class="hero"><div class="cx">
    <div>
      <span class="selo">🎤 Palestra para empresas</span>
      <h1>${mtEsc(p.titulo).replace(/,\s*/, ',<br>').replace(/(Move Resultados)/i, '<em>$1</em>')}</h1>
      <p class="sub">${mtEsc(p.mensagem)}</p>
      <div class="acoes"><a class="bt ambar" href="#contratar">Levar para minha empresa</a><a class="bt claro" href="#roteiro">Ver o roteiro</a></div>
      <div class="prova"><div><b>${mtEsc(p.duracao)}</b>de conteúdo prático</div><div><b>3</b>formatos</div><div><b>1</b>compromisso por participante</div></div>
    </div>
    ${m.videoPalestra ? `<div class="foto" style="aspect-ratio:9/16;max-height:640px;"><video src="${mtEsc(m.videoPalestra)}" controls playsinline preload="metadata" ${m.fotoUrl ? `poster="${mtEsc(m.fotoUrl)}"` : ''} style="width:100%;height:100%;object-fit:cover;background:#000;"></video></div>` : `<div class="foto">${m.fotoUrl ? `<img src="${mtEsc(m.fotoUrl)}" alt="${mtEsc(m.mentor)}">` : `<div class="ini">${mtEsc(mtIniciais(m.mentor))}</div>`}<div class="leg"><b>${mtEsc(m.mentor)}</b>+12 anos liderando operações com até 250 pessoas</div></div>`}
  </div></section>

  <section><div class="cx">
    <div class="titulo"><small>Para quem</small><h2>Para os líderes que fazem a operação acontecer</h2><p>${mtEsc(d.publico.corporativo)} Ideal para SIPAT, convenções de vendas e de operações, reuniões de resultado e programas de desenvolvimento de líderes.</p></div>
    <div class="grade g3">
      <div class="card"><h3>🔥 Time engajado</h3><p>Como motivar sem prometer dinheiro: reconhecimento, propósito e clareza.</p></div>
      <div class="card"><h3>📊 Indicador que todos entendem</h3><p>Quem não mede, discute. Quem mede, decide. Gestão à vista que o time da ponta entende.</p></div>
      <div class="card"><h3>🧭 Rotina e sucessores</h3><p>A rotina do líder que tira o time do apaga-incêndio e forma os próximos líderes.</p></div>
    </div>
  </div></section>

  <section class="alt" id="roteiro"><div class="cx">
    <div class="titulo"><small>Roteiro</small><h2>Uma jornada do chão à gestão, em ${mtEsc(p.duracao)}</h2></div>
    <div class="linha-tempo">${p.roteiro.map(r => `<div class="degrau"><div class="ano">${mtEsc(r.tempo)}</div><div><b>${mtEsc(r.bloco)}</b></div></div>`).join('')}</div>
  </div></section>

  <section class="escuro"><div class="cx">
    <div class="titulo"><small>Frases que o público leva</small><h2>O que fica depois da palestra</h2></div>
    <div class="grade g2">${p.frases.map(f => `<div class="card"><h3 style="font-size:20px;">"${mtEsc(f)}"</h3></div>`).join('')}</div>
  </div></section>

  <section><div class="cx">
    <div class="titulo"><small>Formatos</small><h2>Escolha o formato do seu evento</h2></div>
    <div class="grade g3">${p.versoes.map(v => `<div class="card"><h3>${mtEsc(v.nome)}</h3><p>${mtEsc(v.uso)}</p></div>`).join('')}</div>
    <div class="card" style="margin-top:18px;border-left:5px solid var(--ambar);"><h3>🏭 Treinamento in-company</h3><p>${mtEsc(inc.produto || '')}: o método MOVER aplicado com a turma de líderes da sua empresa, com ferramentas práticas e acompanhamento de indicador.</p></div>
  </div></section>

  <section class="alt" id="contratar"><div class="cx" style="max-width:760px;">
    <div class="titulo centro"><small>Contratar</small><h2>Leve a palestra para os líderes da sua empresa</h2><p>Preencha e receba a proposta em até 1 dia útil.</p></div>
    <div class="card" style="background:#fff;">
      <form class="form" id="f-emp" onsubmit="mtPedirPalestra(event)">
        <div class="dupla"><label>Seu nome<input name="nome" required autocomplete="name"></label><label>Cargo<input name="cargo" placeholder="Ex.: Analista de RH"></label></div>
        <div class="dupla"><label>Empresa<input name="empresa" required></label><label>Cidade<input name="cidade"></label></div>
        <div class="dupla"><label>WhatsApp (com DDD)<input name="whatsapp" required inputmode="tel"></label><label>E-mail<input name="email" type="email" required></label></div>
        <label>Tema da palestra<select name="tema">
          <option>${mtEsc(p.titulo)} (liderança e motivação)</option>
          <option>Indicadores e gestão à vista: o time entendendo o resultado</option>
          <option>Rotina do líder: saindo do apaga-incêndio</option>
          <option>Formação de sucessores e novos líderes</option>
          <option>Segurança e cuidado com as pessoas (SIPAT)</option>
          <option>Quero um tema sob medida — explico abaixo</option></select></label>
        <div class="dupla"><label>Tipo de evento<select name="evento"><option>SIPAT</option><option>Convenção / encontro de líderes</option><option>Reunião de resultados</option><option>Treinamento de líderes</option><option>Abertura de evento / integração</option><option>Outro</option></select></label>
          <label>Formato<select name="formato"><option>Palestra de 60 min</option><option>Pocket de 20 min</option><option>Workshop de 4 h</option><option>Treinamento in-company</option></select></label></div>
        <div class="dupla"><label>Data desejada<input name="dataEvento" type="date" min="${new Date().toISOString().slice(0, 10)}"></label><label>Horário<input name="horaEvento" type="time" step="900"></label></div>
        <div class="dupla"><label>Nº de participantes<select name="participantes"><option value="">Selecione</option><option>até 30</option><option>31 a 80</option><option>81 a 150</option><option>151 a 300</option><option>mais de 300</option></select></label>
          <label>Modalidade<select name="modalidade"><option>Presencial</option><option>Online</option><option>Ainda não sei</option></select></label></div>
        <fieldset class="probs"><legend>Qual é hoje o maior problema da empresa com os líderes e o time? <small>(pode marcar mais de um)</small></legend><div class="probs-op">
          ${['Rotatividade alta', 'Time desmotivado', 'Indicadores abaixo da meta', 'Líderes sem preparo', 'Falta de rotina e processos', 'Acidentes e segurança', 'Comunicação ruim', 'Conflito entre áreas'].map(x => `<label><input type="checkbox" value="${x}"><span>${x}</span></label>`).join('')}</div>
        </fieldset>
        <label>Conte mais sobre esse problema e o objetivo do evento<textarea name="mensagem" rows="3" placeholder="Ex.: a rotatividade dos conferentes passou de 8% ao mês e os supervisores não conseguem dar feedback..."></textarea></label>
        <input class="hp" name="site" tabindex="-1" autocomplete="off">
        <div class="msg-area"></div>
        <button class="bt ambar cheio" type="submit">Pedir proposta</button>
      </form>
    </div>
  </div></section>
  ${mtRodape()}`;
})();
async function mtPedirPalestra(ev) {
  ev.preventDefault(); const f = ev.target;
  try {
    const g = n => (f.querySelector(`[name=${n}]`) || {}).value || '', dt = g('dataEvento'), hr = g('horaEvento');
    const problemas = [...f.querySelectorAll('.probs input:checked')].map(x => x.value).join(', ');
    const data = dt ? dt.split('-').reverse().join('/') + (hr ? ' às ' + hr : '') : (hr ? 'horário ' + hr : '');
    await mtEnviar(f, '/api/public/mentoria/lead', { tipo: 'empresa', origem: 'pagina-palestra', data, dataIso: dt, hora: hr, problemas });
    f.innerHTML = `<div class="msg ok" style="font-size:16px;">✅ Pedido recebido! O Lázaro vai te enviar a proposta em até 1 dia útil.</div>${mtWhats() ? `<a class="bt ambar cheio" style="margin-top:12px;" href="${mtWhats('Olá, Lázaro! Acabei de pedir uma proposta de palestra pelo site.')}" target="_blank" rel="noopener">💬 Adiantar pelo WhatsApp</a>` : ''}`;
  } catch (e) {}
}
</script>
</body>
</html>
