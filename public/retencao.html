<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check de Retenção — Impulsionar V4</title>
<style>
  :root { --azul-corp: #0b1329; --vermelho: #dc4c4c; --verde: #16a34a; --cinza-700: #334155; --cinza-500: #64748b; --borda: #e2e8f0; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; color: var(--cinza-700); background: #f4f6fb; }
  .topo { background: linear-gradient(160deg, #0b1329, #16213f); color: #fff; padding: 32px 16px 56px; text-align: center; }
  .topo img { max-width: 140px; max-height: 70px; object-fit: contain; background: #fff; border-radius: 12px; padding: 8px 12px; margin-bottom: 16px; }
  .topo h1 { font-size: 22px; margin: 0 0 8px; line-height: 1.3; }
  .topo p { margin: 0; font-size: 14px; opacity: .85; }
  .conteudo { max-width: 680px; margin: -32px auto 0; padding: 0 16px 48px; }
  .cartao { background: #fff; border-radius: 16px; box-shadow: 0 10px 28px rgba(11,19,41,.12); padding: 22px 20px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 700; margin: 12px 0 4px; }
  input[type=text], textarea { width: 100%; border: 1.5px solid var(--borda); border-radius: 10px; padding: 11px 12px; font-size: 15px; font-family: inherit; }
  input[type=text]:focus, textarea:focus { outline: none; border-color: var(--vermelho); }
  .pergunta { border-top: 1px solid var(--borda); padding-top: 14px; margin-top: 14px; }
  .pergunta:first-child { border-top: none; margin-top: 0; padding-top: 0; }
  .pergunta h3 { font-size: 15px; margin: 0 0 8px; color: var(--azul-corp); }
  .opcao { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--borda); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; cursor: pointer; font-size: 14px; }
  .opcao input { margin-top: 3px; }
  .opcao:has(input:checked) { border-color: var(--vermelho); background: #fef2f2; }
  button { width: 100%; background: var(--vermelho); color: #fff; border: none; border-radius: 30px; padding: 15px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; }
  button:disabled { opacity: .6; cursor: wait; }
  .erro { color: #b91c1c; background: #fef2f2; border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 12px; display: none; }
  .sucesso { text-align: center; padding: 30px 10px; }
  .sucesso .icone { font-size: 48px; }
  .sub { font-size: 12.5px; color: var(--cinza-500); }
  .rodape { text-align: center; font-size: 12px; color: #94a3b8; margin-top: 20px; }
</style>
</head>
<body>
  <div class="topo">
    <div id="logo"></div>
    <h1 id="titulo">Check de Retenção</h1>
    <p id="subtitulo">Carregando...</p>
  </div>
  <div class="conteudo" id="conteudo"></div>
  <div class="rodape">Powered by Impulsionar V4</div>
<script>
  const token = new URLSearchParams(location.search).get('t') || '';
  const conteudo = document.getElementById('conteudo');
  let perguntas = [];

  function esc(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }

  function mostrarMensagem(icone, titulo, texto) {
    conteudo.innerHTML = `<div class="cartao sucesso"><div class="icone">${icone}</div><h2>${esc(titulo)}</h2><p class="sub">${esc(texto || '')}</p></div>`;
  }

  async function carregar() {
    try {
      const r = await fetch('/api/public/retencao/' + encodeURIComponent(token));
      const d = await r.json();
      if (!r.ok) {
        document.getElementById('subtitulo').textContent = '';
        return mostrarMensagem('⚠️', d.error || 'Link inválido.', 'Confira o link com quem aplicou o treinamento.');
      }
      perguntas = d.perguntas || [];
      document.title = d.titulo + ' — Check de Retenção';
      document.getElementById('titulo').textContent = d.titulo;
      document.getElementById('subtitulo').textContent = [d.empresa, d.pilar ? 'Pilar ' + d.pilar : ''].filter(Boolean).join(' · ');
      if (d.logo) document.getElementById('logo').innerHTML = `<img src="${esc(d.logo)}" alt="">`;
      conteudo.innerHTML = `
        <div class="cartao">
          <label for="nome">Seu nome completo *</label>
          <input type="text" id="nome" autocomplete="name">
          <label for="matricula">Matrícula (opcional)</label>
          <input type="text" id="matricula">
        </div>
        <div class="cartao">
          ${perguntas.map((p, i) => `
            <div class="pergunta">
              <h3>${i + 1}. ${esc(p.texto)}</h3>
              ${p.tipo === 'multipla'
                ? p.opcoes.map((o, j) => `<label class="opcao"><input type="radio" name="p${i}" value="${j}"><span>${esc(o)}</span></label>`).join('')
                : `<textarea id="p${i}" rows="3" placeholder="Sua resposta..."></textarea>`}
            </div>`).join('')}
          <div class="erro" id="erro"></div>
          <button id="enviar" onclick="enviar()">Enviar respostas</button>
        </div>`;
    } catch (e) {
      document.getElementById('subtitulo').textContent = '';
      mostrarMensagem('⚠️', 'Não foi possível carregar o check.', 'Verifique sua conexão e tente novamente.');
    }
  }

  async function enviar() {
    const erro = document.getElementById('erro');
    const botao = document.getElementById('enviar');
    erro.style.display = 'none';
    const nome = document.getElementById('nome').value.trim();
    if (!nome) { erro.textContent = 'Informe seu nome.'; erro.style.display = 'block'; document.getElementById('nome').focus(); return; }
    const respostas = perguntas.map((p, i) => {
      if (p.tipo === 'multipla') { const m = document.querySelector(`input[name="p${i}"]:checked`); return m ? Number(m.value) : null; }
      return document.getElementById('p' + i).value.trim();
    });
    const faltando = respostas.findIndex((v, i) => perguntas[i].tipo === 'multipla' ? v === null : !v);
    if (faltando >= 0) { erro.textContent = `Responda a pergunta ${faltando + 1}.`; erro.style.display = 'block'; return; }
    botao.disabled = true; botao.textContent = 'Enviando...';
    try {
      const r = await fetch('/api/public/retencao/' + encodeURIComponent(token), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome, matricula: document.getElementById('matricula').value.trim(), respostas })
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Erro ao enviar.');
      mostrarMensagem('✅', 'Respostas enviadas!', d.total ? `Você acertou ${d.acertos} de ${d.total} pergunta(s) objetiva(s). Obrigado!` : 'Obrigado pela participação.');
      window.scrollTo(0, 0);
    } catch (e) {
      erro.textContent = e.message; erro.style.display = 'block';
      botao.disabled = false; botao.textContent = 'Enviar respostas';
    }
  }

  carregar();
</script>
</body>
</html>
