<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Gravar com teleprompter — Impulsionar V4</title>
<style>
  :root { --cor: #dc4c4c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; overflow: hidden; }
  #camera { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #camera.espelho { transform: scaleX(-1); }
  /* teleprompter: perto da lente (topo), para o olhar parecer na câmera */
  .prompter { position: fixed; left: 0; right: 0; top: 0; height: 44%; background: linear-gradient(rgba(0,0,0,.75), rgba(0,0,0,.58) 82%, rgba(0,0,0,0)); z-index: 2; }
  .prompter .janela { position: absolute; left: 16px; right: 16px; top: calc(env(safe-area-inset-top) + 62px); bottom: 8px; overflow: hidden; -webkit-mask-image: linear-gradient(transparent, #000 12%, #000 85%, transparent); mask-image: linear-gradient(transparent, #000 12%, #000 85%, transparent); }
  .prompter .texto { padding-top: 10px; }
  .prompter.oculto { display: none; }
  .prompter .texto { font-size: var(--tam, 30px); line-height: 1.38; font-weight: 700; text-align: center; white-space: pre-wrap; will-change: transform; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  .prompter .texto.espelhoTxt { transform: scaleX(-1); }

  .topo { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 10px) 12px 8px; z-index: 5; }
  .topo .tit { flex: 1; font-size: 13px; font-weight: 700; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rec-tempo { background: var(--cor); padding: 4px 10px; border-radius: 12px; font-size: 13px; font-weight: 800; display: none; font-variant-numeric: tabular-nums; }
  .rec-tempo.on { display: inline-block; animation: pisca 1.2s infinite; } @keyframes pisca { 50% { opacity: .6; } }
  .ic { width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(0,0,0,.5); color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(6px); flex-shrink: 0; }
  .ic.on { background: var(--cor); }
  .base { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 14px calc(env(safe-area-inset-bottom) + 18px); z-index: 5; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.7)); }
  .ajustes { display: flex; justify-content: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .ajuste { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,.55); border-radius: 22px; padding: 4px 6px; font-size: 12px; }
  .ajuste button { width: 32px; height: 32px; border-radius: 50%; border: none; background: rgba(255,255,255,.15); color: #fff; font-size: 17px; cursor: pointer; }
  .ajuste span { min-width: 58px; text-align: center; }
  .acoes { display: flex; align-items: center; justify-content: space-around; }
  .gravar { width: 78px; height: 78px; border-radius: 50%; border: 5px solid #fff; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .gravar i { width: 58px; height: 58px; border-radius: 50%; background: var(--cor); transition: .2s; }
  .gravar.on i { width: 30px; height: 30px; border-radius: 8px; }
  .lado { width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; opacity: .9; }
  .contagem { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-size: 140px; font-weight: 900; z-index: 8; text-shadow: 0 6px 30px rgba(0,0,0,.6); }
  .contagem.on { display: flex; }
  .tela { position: fixed; inset: 0; background: #0b1329; z-index: 10; display: none; flex-direction: column; padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px); overflow-y: auto; }
  .tela.on { display: flex; }
  .tela h2 { margin: 6px 0 10px; font-size: 20px; }
  .tela textarea { flex: 1; min-height: 50vh; width: 100%; border-radius: 12px; border: 1px solid #2a3244; background: #0d1017; color: #fff; padding: 12px; font-size: 16px; line-height: 1.5; font-family: inherit; }
  .bt { width: 100%; border: none; border-radius: 26px; padding: 15px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; background: var(--cor); color: #fff; }
  .bt.sec { background: #1e2533; } .bt:disabled { opacity: .6; }
  .revisao video { width: 100%; max-height: 58vh; border-radius: 12px; background: #000; }
  .barra { height: 8px; background: #1e2533; border-radius: 4px; overflow: hidden; margin-top: 12px; display: none; } .barra i { display: block; height: 100%; width: 0; background: var(--cor); }
  .msg { text-align: center; font-size: 14px; color: #cbd5e1; margin-top: 10px; min-height: 18px; line-height: 1.5; }
  .erro { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; z-index: 20; background: #0b1329; }
  .dica { font-size: 12.5px; color: #94a3b8; margin: 0 0 8px; line-height: 1.5; }
</style>
</head>
<body>
  <video id="camera" autoplay muted playsinline class="espelho"></video>
  <div class="prompter" id="prompter"><div class="janela"><div class="texto" id="texto"></div></div></div>
  <div class="topo">
    <span class="tit" id="titulo">Impulsionar V4</span>
    <span class="rec-tempo" id="tempo">● 00:00</span>
    <button class="ic" onclick="abrirEditor()" title="Editar roteiro">✏️</button>
    <button class="ic" id="b-prompter" onclick="alternarPrompter()" title="Mostrar/ocultar texto">📝</button>
    <button class="ic" onclick="virarCamera()" title="Trocar câmera">🔄</button>
  </div>
  <div class="contagem" id="contagem">3</div>
  <div class="base">
    <div class="ajustes">
      <div class="ajuste"><button onclick="velocidade(-10)">−</button><span id="v-vel">🐢 Vel. 40</span><button onclick="velocidade(10)">+</button></div>
      <div class="ajuste"><button onclick="tamanho(-3)">A−</button><span id="v-tam">Texto 30</span><button onclick="tamanho(3)">A+</button></div>
    </div>
    <div class="acoes">
      <div class="lado"><button class="ic" id="b-rolar" onclick="alternarRolagem()">▶</button>Rolar texto</div>
      <button class="gravar" id="b-gravar" onclick="alternarGravacao()"><i></i></button>
      <div class="lado"><button class="ic" onclick="voltarTexto()">⏮</button>Voltar texto</div>
    </div>
  </div>

  <div class="tela" id="tela-editor">
    <h2>✏️ Roteiro</h2>
    <p class="dica">Escreva ou ajuste o que você vai falar. Deixe uma linha em branco entre as partes — fica mais fácil de ler enquanto grava.</p>
    <textarea id="editor-txt"></textarea>
    <button class="bt" onclick="salvarRoteiro()">Usar este roteiro</button>
    <button class="bt sec" onclick="fecharEditor()">Cancelar</button>
  </div>
  <div class="tela revisao" id="tela-revisao">
    <h2>🎬 Ficou bom?</h2>
    <video id="revisao" controls playsinline></video>
    <div class="barra" id="barra"><i id="barra-i"></i></div>
    <div class="msg" id="msg"></div>
    <button class="bt" id="b-enviar" onclick="enviar()">📤 Enviar para o projeto</button>
    <button class="bt sec" onclick="gravarDeNovo()">🔁 Gravar de novo</button>
    <a class="bt sec" id="b-baixar" style="display:block;text-align:center;text-decoration:none;color:#fff;" download="gravacao.mp4">⬇️ Salvar no celular</a>
  </div>

<script>
const codigo = new URLSearchParams(location.search).get('c') || '';
let stream = null, frente = true, rec = null, partes = [], inicioRec = 0, timerRec = null, blobFinal = null;
let rolando = false, pos = 0, vel = 40, tam = 30, ultimo = 0, raf = null, wake = null, roteiro = '';
const $ = id => document.getElementById(id);

async function carregar() {
  try {
    const r = await fetch('/api/public/gravador/' + encodeURIComponent(codigo)); const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Link inválido.');
    $('titulo').textContent = d.titulo || 'Impulsionar V4';
    if (d.cor) document.documentElement.style.setProperty('--cor', d.cor);
    roteiro = d.roteiro || ''; mostrarTexto();
    if (!roteiro.trim()) abrirEditor();
  } catch (e) { erro(e.message); return; }
  try { tam = Number(localStorage.getItem('tp_tam')) || 30; vel = Number(localStorage.getItem('tp_vel')) || 40; } catch (e) {}
  aplicarAjustes(); await ligarCamera();
}
function erro(t) { document.body.insertAdjacentHTML('beforeend', `<div class="erro"><div style="font-size:48px;">⚠️</div><h2>${t.replace(/</g, '&lt;')}</h2></div>`); }
function mostrarTexto() { $('texto').textContent = roteiro.trim() ? roteiro + '\n\n\n\n🎬 Fim do roteiro' : 'Toque em ✏️ para escrever o roteiro.'; pos = 0; aplicarPos(); }
async function ligarCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: frente ? 'user' : 'environment', width: { ideal: 1080 }, height: { ideal: 1920 }, frameRate: { ideal: 30 } }, audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    $('camera').srcObject = stream; $('camera').classList.toggle('espelho', frente);
  } catch (e) { erro('Não consegui abrir a câmera/microfone. Permita o acesso nas configurações do navegador e recarregue a página.'); }
}
function virarCamera() { if (rec) return; frente = !frente; ligarCamera(); }
function aplicarAjustes() {
  document.documentElement.style.setProperty('--tam', tam + 'px');
  $('v-tam').textContent = 'Texto ' + tam; $('v-vel').textContent = (vel < 35 ? '🐢' : vel > 70 ? '🐇' : '🚶') + ' Vel. ' + vel;
  try { localStorage.setItem('tp_tam', tam); localStorage.setItem('tp_vel', vel); } catch (e) {}
}
function velocidade(d) { vel = Math.max(10, Math.min(160, vel + d)); aplicarAjustes(); }
function tamanho(d) { tam = Math.max(18, Math.min(64, tam + d)); aplicarAjustes(); }
function aplicarPos() { $('texto').style.transform = `translateY(${-pos}px)`; }
function passo(t) {
  if (!rolando) return;
  const dt = ultimo ? (t - ultimo) / 1000 : 0; ultimo = t;
  pos += vel * dt * (tam / 30);
  const max = $('texto').scrollHeight - 40; if (pos >= max) { pos = max; alternarRolagem(false); }
  aplicarPos(); raf = requestAnimationFrame(passo);
}
function alternarRolagem(forcar) {
  rolando = forcar !== undefined ? forcar : !rolando; ultimo = 0;
  $('b-rolar').textContent = rolando ? '⏸' : '▶'; $('b-rolar').classList.toggle('on', rolando);
  if (rolando) raf = requestAnimationFrame(passo); else cancelAnimationFrame(raf);
}
function voltarTexto() { pos = 0; aplicarPos(); }
function alternarPrompter() { $('prompter').classList.toggle('oculto'); $('b-prompter').classList.toggle('on', !$('prompter').classList.contains('oculto')); }
// arrastar o texto com o dedo para ajustar a posição
(function () { let y0 = null, p0 = 0; const el = $('prompter');
  el.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; p0 = pos; }, { passive: true });
  el.addEventListener('touchmove', e => { if (y0 === null) return; pos = Math.max(0, p0 - (e.touches[0].clientY - y0)); aplicarPos(); }, { passive: true });
  el.addEventListener('touchend', () => { y0 = null; });
})();
function abrirEditor() { $('editor-txt').value = roteiro; $('tela-editor').classList.add('on'); }
function fecharEditor() { $('tela-editor').classList.remove('on'); }
function salvarRoteiro() {
  roteiro = $('editor-txt').value; mostrarTexto(); fecharEditor();
  fetch('/api/public/gravador/' + encodeURIComponent(codigo) + '/roteiro', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ roteiro }) }).catch(() => {});
}
function tipoGravacao() { return ['video/mp4;codecs=avc1,mp4a', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || ''; }
async function alternarGravacao() {
  if (rec) { rec.stop(); return; }
  if (!stream) return ligarCamera();
  if (!window.MediaRecorder) return alert('Este navegador não grava vídeo. Use o Chrome (Android) ou o Safari atualizado (iPhone).');
  // contagem 3-2-1 e começa a rolar o texto junto
  for (const n of [3, 2, 1]) { $('contagem').textContent = n; $('contagem').classList.add('on'); await new Promise(r => setTimeout(r, 800)); }
  $('contagem').classList.remove('on');
  const tipo = tipoGravacao(); partes = [];
  rec = new MediaRecorder(stream, tipo ? { mimeType: tipo, videoBitsPerSecond: 8000000 } : undefined);
  rec.ondataavailable = e => { if (e.data.size) partes.push(e.data); };
  rec.onstop = () => {
    clearInterval(timerRec); $('tempo').classList.remove('on'); $('b-gravar').classList.remove('on'); alternarRolagem(false);
    blobFinal = new Blob(partes, { type: rec.mimeType || 'video/mp4' }); blobFinal.duracao = (Date.now() - inicioRec) / 1000; rec = null;
    const url = URL.createObjectURL(blobFinal); $('revisao').src = url; $('b-baixar').href = url; $('b-baixar').download = 'gravacao.' + (/mp4/.test(blobFinal.type) ? 'mp4' : 'webm');
    $('msg').textContent = ''; $('barra').style.display = 'none'; $('b-enviar').disabled = false; $('tela-revisao').classList.add('on');
    if (wake) { wake.release().catch(() => {}); wake = null; }
  };
  rec.start(1000); inicioRec = Date.now();
  try { wake = await navigator.wakeLock.request('screen'); } catch (e) {}
  $('b-gravar').classList.add('on'); $('tempo').classList.add('on');
  timerRec = setInterval(() => { const s = Math.floor((Date.now() - inicioRec) / 1000); $('tempo').textContent = '● ' + String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }, 300);
  pos = 0; aplicarPos(); alternarRolagem(true);
}
function gravarDeNovo() { $('tela-revisao').classList.remove('on'); $('revisao').pause(); }
function enviar() {
  if (!blobFinal) return;
  const fd = new FormData(); fd.append('file', blobFinal, 'gravacao.' + (/mp4/.test(blobFinal.type) ? 'mp4' : 'webm')); fd.append('duracao', String(blobFinal.duracao || 0));
  const x = new XMLHttpRequest(); x.open('POST', '/api/public/gravador/' + encodeURIComponent(codigo) + '/video');
  $('barra').style.display = 'block'; $('b-enviar').disabled = true; $('msg').textContent = 'Enviando...';
  x.upload.onprogress = e => { if (e.lengthComputable) { $('barra-i').style.width = Math.round(e.loaded * 100 / e.total) + '%'; $('msg').textContent = 'Enviando... ' + Math.round(e.loaded * 100 / e.total) + '%'; } };
  x.onload = () => { let j = {}; try { j = JSON.parse(x.responseText); } catch (e) {} if (x.status < 300) { $('msg').innerHTML = '✅ ' + (j.message || 'Enviado!') + '<br>Pode gravar outra versão ou voltar ao computador.'; } else { $('msg').textContent = '⚠️ ' + (j.error || 'Falha no envio.'); $('b-enviar').disabled = false; } };
  x.onerror = () => { $('msg').textContent = '⚠️ Falha de conexão. Tente de novo (ou salve no celular).'; $('b-enviar').disabled = false; };
  x.send(fd);
}
carregar();
</script>
</body>
</html>
