<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1324">
<title>Controle da apresentação — Impulsionar V4</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0b1324; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; overscroll-behavior: none; }
  .app { display: flex; flex-direction: column; height: 100%; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); gap: 12px; }
  .topo { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .tt { font-size: 13px; font-weight: 700; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; background: #334155; white-space: nowrap; }
  .st.on { background: #16a34a; }
  .atual { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 14px; }
  .rot { font-size: 11px; letter-spacing: .1em; opacity: .6; font-weight: 800; }
  .nome { font-size: 20px; font-weight: 800; margin-top: 4px; line-height: 1.25; }
  .cont { font-size: 13px; opacity: .7; margin-top: 4px; }
  .prox { font-size: 13px; opacity: .75; margin-top: 10px; border-top: 1px dashed rgba(255,255,255,.15); padding-top: 8px; }
  .notas ul { padding-left: 18px; margin: 4px 0; }
  .bts { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; }
  .bt { border: none; border-radius: 18px; font-size: 22px; font-weight: 800; color: #fff; padding: 20px 0; cursor: pointer; touch-action: manipulation; user-select: none; }
  .bt:active { transform: scale(.97); filter: brightness(1.15); }
  .ant { background: #334155; }
  .prx { background: #dc4c4c; }
  .bt:disabled { opacity: .35; }
  .barra { height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
  .barra div { height: 100%; background: #dc4c4c; transition: width .25s; }
  .erro { margin: auto; text-align: center; padding: 30px; font-size: 16px; }
  .relogio { font-variant-numeric: tabular-nums; font-size: 13px; opacity: .8; }
  .pv { position: relative; width: 100%; border-radius: 10px; overflow: hidden; background: #111827; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
  .pv .mt-sl { pointer-events: none; }
  .pv-vazio { aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; font-size: 13px; opacity: .5; }
  .agora { border: 2px solid #dc4c4c; }
  .seguir { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg { cursor: pointer; min-width: 0; }
  .pv { aspect-ratio: 16/9; }
  .pv > .mt-sl { height: 100%; }
  .seg .lbl { font-size: 11px; font-weight: 800; letter-spacing: .08em; opacity: .65; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 6px; }
  .seg .lbl span:last-child { font-weight: 600; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .linha-info { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12.5px; opacity: .8; margin-top: 6px; }
  .linha-info strong { font-size: 14px; opacity: 1; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .abas { display: flex; gap: 6px; }
  .aba { flex: 1; border: none; border-radius: 10px; padding: 8px; font-weight: 800; font-size: 13px; background: rgba(255,255,255,.06); color: #fff; opacity: .6; }
  .aba.on { opacity: 1; background: rgba(255,255,255,.14); }
  .cam { flex: 1; display: none; flex-direction: column; gap: 8px; min-height: 0; }
  .cam video { width: 100%; flex: 1; min-height: 0; object-fit: cover; border-radius: 14px; background: #000; }
  .cam-bts { display: flex; gap: 8px; }
  .cam-bts button, .cam-bts a { flex: 1; border: none; border-radius: 12px; padding: 12px; font-weight: 800; font-size: 14px; color: #fff; background: #334155; text-align: center; text-decoration: none; }
  .cam-bts .gravar { background: #dc2626; }
  .cam-info { font-size: 12.5px; opacity: .8; text-align: center; }
  .prog { height: 6px; border-radius: 6px; background: rgba(255,255,255,.15); overflow: hidden; display: none; } .prog div { height: 100%; width: 0; background: #16a34a; }
  .rec-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #ef4444; margin-right: 6px; animation: pisca 1s infinite; } @keyframes pisca { 50% { opacity: .2; } }
  .notas { flex: 1; overflow-y: auto; background: rgba(255,255,255,.04); border-radius: 14px; padding: 10px 12px; font-size: 14.5px; line-height: 1.45; min-height: 50px; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topo"><div class="tt" id="tt">Conectando...</div><span class="st" id="st">conectando</span></div>
  <div class="barra"><div id="barra" style="width:0%"></div></div>
  <style id="css-slides"></style>
  <div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;"><div class="rot" id="rot">AGORA</div><div class="relogio" id="rel">00:00</div></div>
    <div class="pv agora" id="pv0"><div class="pv-vazio">Aguardando a apresentação...</div></div>
    <div class="linha-info"><strong id="nome"></strong><span id="cont"></span></div>
  </div>
  <div class="seguir">
    <div class="seg" id="seg1" onclick="irPara(1)"><div class="lbl"><span>A SEGUIR</span><span id="t1"></span></div><div class="pv" id="pv1"><div class="pv-vazio">—</div></div></div>
    <div class="seg" id="seg2" onclick="irPara(2)"><div class="lbl"><span>DEPOIS</span><span id="t2"></span></div><div class="pv" id="pv2"><div class="pv-vazio">—</div></div></div>
  </div>
  <div class="abas"><button class="aba on" id="aba-notas" onclick="aba('notas')">🗒️ Notas</button><button class="aba" id="aba-cam" onclick="aba('cam')">🎥 Câmera</button></div>
  <div class="notas" id="notas"><span style="opacity:.55">As notas do apresentador aparecem aqui.</span></div>
  <div class="cam" id="cam">
    <video id="vid" playsinline muted autoplay></video>
    <div class="cam-info" id="cam-info">Ative a câmera para filmar o treinamento (vídeo e áudio). Quando o apresentador clicar em ⏺ Gravar, o celular grava junto.</div>
    <div class="prog" id="prog"><div></div></div>
    <div class="cam-bts" id="cam-bts"><button onclick="ativarCamera()">📷 Ativar câmera</button></div>
  </div>
  <div class="bts">
    <button class="bt ant" id="ant" onclick="cmd('anterior')">◀</button>
    <button class="bt prx" id="prx" onclick="cmd('proximo')">Próximo ▶</button>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
  const codigo = new URLSearchParams(location.search).get('c') || '';
  const $ = id => document.getElementById(id);
  function esc(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
  function textoHtml(t) {
    const linhas = String(t || '').split('\n'); let h = '', ul = false;
    linhas.forEach(l => { const b = l.match(/^\s*[•\-\*–]\s*(.*)$/); if (b) { if (!ul) { h += '<ul>'; ul = true; } h += '<li>' + esc(b[1]) + '</li>'; } else { if (ul) { h += '</ul>'; ul = false; } if (l.trim()) h += '<p style="margin:0 0 6px;">' + esc(l) + '</p>'; } });
    return h + (ul ? '</ul>' : '');
  }
  let estado = null, ini = null;
  const socket = io({ transports: ['websocket', 'polling'] });
  function entrar() { socket.emit('mt-controle-entrar', { codigo }); }
  socket.on('connect', () => { $('st').textContent = 'conectado'; $('st').classList.add('on'); entrar(); });
  socket.on('disconnect', () => { $('st').textContent = 'reconectando'; $('st').classList.remove('on'); });
  socket.on('mt-controle-erro', d => { document.getElementById('app').innerHTML = `<div class="erro">⚠️<br><br>${esc(d.error)}</div>`; });
  socket.on('mt-controle-ok', d => { $('tt').textContent = '🎤 ' + d.titulo; socket.emit('mt-comando', { cmd: 'pedir-estado' }); });
  let cssAtual = '';
  function ajustar(box) {
    box.style.fontSize = Math.max(3, box.clientWidth / 60) + 'px';
    box.querySelectorAll('.mt-sl:not(.mt-sl-arq)').forEach(sl => {
      const BASE = { 'mt-sl-tit': 2.6, 'mt-sl-dest-t': 4, 'mt-sl-dest-x': 1.9, 'mt-sl-corpo': 1, 'mt-mod-nome': 4.4, 'mt-capa-tit': 4.6, 'mt-capa-obj': 1.8 };
      const alvos = [...sl.querySelectorAll('.mt-sl-corpo, .mt-sl-dest-x, .mt-sl-tit, .mt-sl-dest-t, .mt-mod-nome, .mt-capa-tit, .mt-capa-obj')].map(el => ({ el, base: BASE[Object.keys(BASE).find(c => el.classList.contains(c))] }));
      let k = 1;
      for (let n = 0; n < 16 && sl.scrollHeight > sl.clientHeight + 1 && k > 0.4; n++) { k -= 0.05; alvos.forEach(a => { a.el.style.fontSize = (a.base * (a.base > 2 ? Math.max(0.65, 1 - (1 - k) * 0.6) : k)) + 'em'; }); }
    });
  }
  function irPara(k) { if (!estado || !estado.telas || !estado.telas[k]) return; if (navigator.vibrate) navigator.vibrate(15); socket.emit('mt-comando', { cmd: 'ir', i: estado.telas[k].i }); }
  socket.on('mt-estado', e => {
    estado = e; if (e.ini) ini = e.ini;
    if (e.css && e.css !== cssAtual) { cssAtual = e.css; $('css-slides').textContent = e.css; }
    $('rot').textContent = 'AGORA' + (e.modulo ? ' · ' + e.modulo.toUpperCase() : '');
    $('nome').textContent = e.titulo || '—';
    $('cont').textContent = `${e.i + 1} / ${e.total}`;
    [0, 1, 2].forEach(k => {
      const t = (e.telas || [])[k], box = $('pv' + k);
      box.innerHTML = t ? t.html : `<div class="pv-vazio">${k ? 'Fim da apresentação' : '—'}</div>`;
      if (k) { $('t' + k).textContent = t ? t.titulo : ''; $('seg' + k).style.opacity = t ? 1 : .35; }
      if (t) requestAnimationFrame(() => ajustar(box));
    });
    $('notas').innerHTML = e.notas ? textoHtml(e.notas) : '<span style="opacity:.55">Sem notas neste slide.</span>';
    $('barra').style.width = Math.round((e.i + 1) * 100 / e.total) + '%';
    $('ant').disabled = e.i <= 0; $('prx').disabled = e.i >= e.total - 1;
  });
  // ----- Câmera do celular -----
  let camStream = null, rec = null, pedacos = [], recIni = 0, facing = 'environment', ultimoBlob = null;
  function aba(q) {
    $('aba-notas').classList.toggle('on', q === 'notas'); $('aba-cam').classList.toggle('on', q === 'cam');
    $('notas').style.display = q === 'notas' ? '' : 'none'; $('cam').style.display = q === 'cam' ? 'flex' : 'none';
  }
  function status() { socket.emit('mt-gravacao-status', { camera: !!camStream, gravando: !!(rec && rec.state === 'recording'), enviando: !!enviando }); }
  let enviando = false;
  function botoes() {
    const b = $('cam-bts');
    if (!camStream) { b.innerHTML = '<button onclick="ativarCamera()">📷 Ativar câmera</button>'; return; }
    if (rec && rec.state === 'recording') { b.innerHTML = '<button class="gravar" onclick="pararGravacao()">⏹ Parar filmagem</button>'; return; }
    b.innerHTML = '<button class="gravar" onclick="iniciarGravacao()">⏺ Filmar</button><button onclick="virarCamera()">🔄 Virar</button>' + (ultimoBlob ? '<a id="baixar">⬇ Salvar no celular</a>' : '');
    if (ultimoBlob) { const a = $('baixar'); a.href = URL.createObjectURL(ultimoBlob); a.download = 'filmagem-treinamento.' + (/mp4/.test(ultimoBlob.type) ? 'mp4' : 'webm'); }
  }
  async function ativarCamera() {
    try {
      camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: { echoCancellation: true, noiseSuppression: true } });
      $('vid').srcObject = camStream; $('cam-info').textContent = 'Câmera pronta. Toque em ⏺ Filmar — ou aguarde o apresentador iniciar a gravação.';
      aba('cam'); botoes(); status();
    } catch (e) { $('cam-info').textContent = '⚠️ Não foi possível abrir a câmera/microfone. Libere o acesso no navegador.'; }
  }
  async function virarCamera() { facing = facing === 'environment' ? 'user' : 'environment'; if (camStream) camStream.getTracks().forEach(t => t.stop()); camStream = null; await ativarCamera(); }
  function iniciarGravacao() {
    if (!camStream || (rec && rec.state === 'recording')) return;
    const mime = ['video/mp4', 'video/webm;codecs=vp8,opus', 'video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    try { rec = new MediaRecorder(camStream, mime ? { mimeType: mime, videoBitsPerSecond: 2000000 } : undefined); } catch (e) { $('cam-info').textContent = '⚠️ Este celular não consegue gravar pelo navegador.'; return; }
    pedacos = []; recIni = Date.now();
    rec.ondataavailable = e => { if (e.data && e.data.size) pedacos.push(e.data); };
    rec.onstop = enviarFilmagem;
    rec.start(2000);
    $('cam-info').innerHTML = '<span class="rec-dot"></span>Filmando... <span id="rec-t">00:00</span>';
    botoes(); status();
  }
  function pararGravacao() { if (rec && rec.state !== 'inactive') rec.stop(); }
  function enviarFilmagem() {
    const tipo = (rec.mimeType || 'video/webm').split(';')[0];
    const blob = new Blob(pedacos, { type: tipo }); ultimoBlob = blob;
    const dur = Math.round((Date.now() - recIni) / 1000);
    enviando = true; status(); botoes();
    $('cam-info').textContent = `Enviando a filmagem (${(blob.size / 1048576).toFixed(1)} MB)...`;
    $('prog').style.display = 'block';
    const fd = new FormData(); fd.append('file', blob, 'filmagem-celular.' + (/mp4/.test(tipo) ? 'mp4' : 'webm')); fd.append('duracao', dur);
    const x = new XMLHttpRequest(); x.open('POST', '/api/public/controle/' + encodeURIComponent(codigo) + '/gravacao');
    x.upload.onprogress = e => { if (e.lengthComputable) $('prog').firstElementChild.style.width = Math.round(e.loaded * 100 / e.total) + '%'; };
    x.onload = () => { enviando = false; $('prog').style.display = 'none'; let j = {}; try { j = JSON.parse(x.responseText); } catch (e) {}
      $('cam-info').textContent = x.status < 300 ? '✅ Filmagem salva no treinamento! Pode filmar de novo quando quiser.' : '⚠️ ' + (j.error || 'Erro ao enviar') + ' — use "Salvar no celular".'; botoes(); status(); };
    x.onerror = () => { enviando = false; $('prog').style.display = 'none'; $('cam-info').textContent = '⚠️ Sem conexão para enviar — use "Salvar no celular".'; botoes(); status(); };
    x.send(fd);
  }
  setInterval(() => { const el = $('rec-t'); if (el && recIni) { const s = Math.floor((Date.now() - recIni) / 1000); el.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); } }, 1000);
  socket.on('mt-gravar', d => {
    if (d.acao === 'iniciar') { if (camStream) iniciarGravacao(); else { aba('cam'); $('cam-info').textContent = '⏺ O apresentador começou a gravar. Toque em "Ativar câmera" para filmar junto.'; } }
    else pararGravacao();
  });
  function cmd(c) { if (navigator.vibrate) navigator.vibrate(15); socket.emit('mt-comando', { cmd: c }); }
  window.addEventListener('resize', () => [0, 1, 2].forEach(k => ajustar($('pv' + k))));
  setInterval(() => { if (!ini) return; const s = Math.floor((Date.now() - ini) / 1000); $('rel').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }, 1000);
  // Passar slide deslizando o dedo também.
  let x0 = null;
  document.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', e => { if (x0 === null || (e.target.closest && e.target.closest('.cam'))) { x0 = null; return; } const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 70) cmd(dx < 0 ? 'proximo' : 'anterior'); x0 = null; });
</script>
</body>
</html>
