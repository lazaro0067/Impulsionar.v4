# Sobe o Impulsionar V4 + HTTPS automático (Caddy) num servidor próprio.
# Uso: docker compose up -d --build   (veja hospedagem/HOSPEDAGEM.md)
services:
  app:
    build:
      context: .
      dockerfile: hospedagem/Dockerfile
    restart: always
    env_file: .env
    environment:
      DB_PATH: /dados/database.sqlite
      UPLOADS_PATH: /dados/uploads
    volumes:
      - ./dados:/dados
    expose:
      - "3000"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    image: caddy:2.8
    restart: always
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./hospedagem/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
